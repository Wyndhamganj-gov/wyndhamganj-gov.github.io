<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WDM — Connect & Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#08090d;--panel:#11131a;--line:#252936;--txt:#f4f5f8;--muted:#9298a8;--pink:#ff477e;--blue:#668cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#252a38;color:white}button.primary{background:linear-gradient(110deg,#ff477e,#8c62ff)}button:disabled{opacity:.5}.hidden{display:none!important}
header{height:62px;position:sticky;top:0;z-index:5;background:#0b0c12ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1100px)/2))}
.logo{font-size:25px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(90deg,#ff477e,#a27bff);color:transparent;background-clip:text}
.wrap{max-width:1100px;margin:auto;padding:22px 16px 90px;display:grid;grid-template-columns: minmax(0,680px) 280px;gap:28px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.stories{display:flex;gap:14px;overflow:auto;padding:15px;margin-bottom:18px}.story{width:66px;flex:0 0 66px;text-align:center;color:var(--muted);font-size:11px;overflow:hidden}.ring{width:58px;height:58px;border-radius:50%;padding:3px;margin:auto auto 6px;background:linear-gradient(45deg,#ffb347,#ff477e,#9a60ff)}.ring img{width:100%;height:100%;object-fit:cover;border:2px solid #11131a;border-radius:50%}
.post{margin-bottom:18px;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:13px}.avatar{width:38px;height:38px;object-fit:cover;border-radius:50%;background:#292d3b}.muted{color:var(--muted)}.media{width:100%;max-height:650px;background:#050507;display:block;object-fit:contain}.postbody{padding:12px 14px}.actions{display:flex;gap:8px;margin-bottom:9px}.actions button{background:transparent;padding:5px 8px;font-size:19px}.caption{line-height:1.55;overflow-wrap:anywhere}.commentline{display:flex;gap:8px;margin-top:10px}.commentline input,.field{min-width:0;flex:1;background:#090b11;color:white;border:1px solid var(--line);padding:11px;border-radius:10px}
.side{position:sticky;top:82px;height:max-content;padding:17px}.userrow{display:flex;gap:10px;align-items:center;margin-bottom:14px}.nav{display:flex;flex-direction:column;gap:7px;margin-top:18px}.nav button{text-align:left;background:transparent;padding:12px}.nav button.active,.nav button:hover{background:#242838}
h3{margin:0 0 12px}.auth{max-width:420px;margin:8vh auto;padding:24px}.auth input{width:100%;margin:7px 0}.topactions{display:flex;gap:8px}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:grid;place-items:center;padding:15px}.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px}.modalbox input,.modalbox textarea{width:100%;margin:7px 0}.modalbox textarea{min-height:90px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.listitem{padding:12px;border-bottom:1px solid var(--line)}.badge{font-size:11px;color:#ff8db0}.empty{text-align:center;padding:40px;color:var(--muted)}#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#252a38;padding:12px 18px;border-radius:12px;z-index:30;display:none}
@media(max-width:850px){.wrap{display:block;max-width:680px}.side{display:none}header{padding:0 14px}}
nav.mobile{display:none;position:fixed;bottom:0;left:0;right:0;background:#10121a;border-top:1px solid var(--line);z-index:6;padding:8px;justify-content:space-around}
@media(max-width:700px){nav.mobile{display:flex}.wrap{padding-top:12px}.stories{border-radius:13px}}
</style>
</head>
<body>
<header><div class="logo">WDM</div><div class="topactions"><button onclick="openCreate()">＋ Create</button><button onclick="showPage('activity')">♡</button><button onclick="showPage('messages')">✉</button></div></header>
<section id="auth" class="auth panel">
<h2>Welcome to WDM</h2><p class="muted">Create your account or sign in.</p>
<div id="registerBox"><input class="field" id="fullName" placeholder="Full name"><input class="field" id="username" placeholder="Username (letters, numbers, _)"><input class="field" id="email" type="email" placeholder="Email"><input class="field" id="password" type="password" placeholder="Password (6+ characters)"><button class="primary" style="width:100%" onclick="register()">Create account</button></div>
<div id="loginBox" class="hidden"><input class="field" id="loginEmail" type="email" placeholder="Email"><input class="field" id="loginPass" type="password" placeholder="Password"><button class="primary" style="width:100%" onclick="login()">Login</button></div>
<p class="muted"><a href="#" onclick="toggleAuth();return false">Switch register / login</a></p><button onclick="googleLogin()" style="width:100%">Continue with Google</button>
</section>
<div id="app" class="hidden">
<div class="wrap"><main>
<div class="stories panel" id="stories"><div class="story" onclick="storyPicker.click()"><div class="ring"><img id="myAvatarStory" src="https://placehold.co/100x100?text=+" /></div>Your story +</div></div>
<section id="feedPage"><div id="feed"></div></section>
<section id="searchPage" class="hidden panel" style="padding:16px"><h3>Discover people & posts</h3><input id="searchInput" class="field" placeholder="Search username or caption..." oninput="searchAll(this.value)"><div id="searchResults"></div></section>
<section id="profilePage" class="hidden panel" style="padding:18px"><div class="userrow"><img id="profileAvatar" class="avatar" style="width:75px;height:75px"><div><h3 id="profileName"></h3><div id="profileHandle" class="muted"></div><div id="profileStats" class="muted"></div></div></div><p id="profileBio"></p><div class="row"><button onclick="editProfile()">Edit profile</button><button onclick="pickAvatar()">Change photo</button></div><div id="myPosts"></div></section>
<section id="messagesPage" class="hidden panel" style="padding:16px"><h3>Messages</h3><input id="messageUser" class="field" placeholder="Recipient username"><button onclick="openDM()">Open chat</button><div id="dmArea"></div></section>
<section id="activityPage" class="hidden panel" style="padding:16px"><h3>Activity</h3><div id="notifications"></div></section>
<section id="savedPage" class="hidden panel" style="padding:16px"><h3>Saved posts</h3><div id="savedPosts"></div></section>
</main>
<aside class="side panel"><div class="userrow"><img id="sideAvatar" class="avatar"><div><b id="sideName"></b><div class="muted" id="sideHandle"></div></div></div><div class="nav"><button onclick="showPage('feed')" class="active">⌂ Home feed</button><button onclick="showPage('search')">⌕ Discover</button><button onclick="showPage('messages')">✉ Messages</button><button onclick="showPage('activity')">♡ Activity</button><button onclick="showPage('saved')">▣ Saved</button><button onclick="showPage('profile')">◉ My profile</button><button onclick="logout()">↪ Log out</button></div><p class="muted" style="font-size:11px;margin-top:25px">WDM community · Share respectfully</p></aside>
</div>
<nav class="mobile"><button onclick="showPage('feed')">⌂</button><button onclick="showPage('search')">⌕</button><button onclick="openCreate()">＋</button><button onclick="showPage('messages')">✉</button><button onclick="showPage('profile')">◉</button></nav>
</div>
<input id="postFile" type="file" accept="image/*,video/*" hidden><input id="storyPicker" type="file" accept="image/*,video/*" hidden><input id="avatarFile" type="file" accept="image/*" hidden>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalContent"></div></div><div id="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyD8ojVhoikbnCRAQ4WrDEkJfdMONeXcuFc",authDomain:"wdm-update.firebaseapp.com",projectId:"wdm-update",storageBucket:"wdm-update.firebasestorage.app",messagingSenderId:"677435578526",appId:"1:677435578526:web:74119dc8309c4ba744838f",measurementId:"G-R4KWL05ZNR"};
const CLOUDINARY_CLOUD_NAME="afcw94ij", CLOUDINARY_UPLOAD_PRESET="wdm_media";
const TELEGRAM_WORKER_URL=""; // Cloudflare Worker deploy hone ke baad yahan uska URL
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
let me=null,unsubs=[],activeDM=null,postFile=null;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function toggleAuth(){$("registerBox").classList.toggle("hidden");$("loginBox").classList.toggle("hidden")}
async function register(){try{let name=$("fullName").value.trim(),username=$("username").value.trim().toLowerCase(),email=$("email").value.trim(),pass=$("password").value;if(!name||!/^[a-z0-9_]{3,20}$/.test(username)||!email||pass.length<6)throw Error("Name, valid username, email aur 6+ character password bharo.");let exists=await db.collection("users").where("username","==",username).get();if(!exists.empty)throw Error("Username pehle se liya gaya hai.");let cred=await auth.createUserWithEmailAndPassword(email,pass);await db.collection("users").doc(cred.user.uid).set({uid:cred.user.uid,fullName:name,username,email,avatar:"https://placehold.co/120x120?text=WDM",bio:"",createdAt:FV.serverTimestamp(),followers:[],following:[]});}catch(e){toast(e.message)}}
async function login(){try{await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPass").value)}catch(e){toast(e.message)}}
async function googleLogin(){try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){toast(e.message)}}
async function logout(){await auth.signOut()}
auth.onAuthStateChanged(async user=>{unsubs.forEach(f=>f());unsubs=[];if(!user){me=null;$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}let ref=db.collection("users").doc(user.uid),d=await ref.get();if(!d.exists){let base=(user.displayName||"WDM User").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12)||"member";let uname=base+"_"+user.uid.slice(0,5);await ref.set({uid:user.uid,fullName:user.displayName||"WDM User",username:uname,email:user.email||"",avatar:user.photoURL||"https://placehold.co/120x120",bio:"",followers:[],following:[],createdAt:FV.serverTimestamp()});d=await ref.get()}me={uid:user.uid,...d.data()};startApp()});
function startApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");paintUser();watchFeed();watchStories();watchNotifications();loadProfile();showPage("feed")}
function paintUser(){["profileAvatar","sideAvatar","myAvatarStory"].forEach(id=>$(id).src=me.avatar||"https://placehold.co/100");$("profileName").textContent=me.fullName;$("profileHandle").textContent="@"+me.username;$("profileBio").textContent=me.bio||"";$("sideName").textContent=me.fullName;$("sideHandle").textContent="@"+me.username}
function showPage(p){["feed","search","profile","messages","activity","saved"].forEach(x=>$(x+"Page").classList.toggle("hidden",x!==p));if(p==="saved")loadSaved()}
function openCreate(){$("modalContent").innerHTML=`<h3>Create a post</h3><input id="caption" class="field" placeholder="Write a caption..."><input id="hashtags" class="field" placeholder="Hashtags (optional)"><div class="row"><button onclick="pickPost()">Choose photo/video</button><button onclick="closeModal()">Cancel</button></div><div id="uploadStatus" class="muted"></div><button class="primary" style="width:100%;margin-top:12px" onclick="publishPost()">Share post</button>`;showModal();$("postFile").onchange=e=>{postFile=e.target.files[0];$("uploadStatus").textContent=postFile?.name||""}}
function showModal(){$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}function pickPost(){$("postFile").click()}
async function upload(file){let fd=new FormData();fd.append("file",file);fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);let r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,{method:"POST",body:fd});let j=await r.json();if(!r.ok)throw Error(j.error?.message||"Cloudinary upload failed");return {url:j.secure_url,type:file.type.startsWith("video/")?"video":"image"}}
async function publishPost(){try{if(!postFile)throw Error("Pehle photo ya video select karo.");$("uploadStatus").textContent="Uploading media…";let m=await upload(postFile),caption=$("caption").value.trim(),hashtags=$("hashtags").value.trim();await db.collection("posts").add({authorId:me.uid,authorName:me.fullName,authorUsername:me.username,authorAvatar:me.avatar,mediaUrl:m.url,mediaType:m.type,caption,hashtags,likes:[],savedBy:[],commentCount:0,createdAt:FV.serverTimestamp()});closeModal();postFile=null;toast("Post shared!");notifyTelegram("New WDM post by @"+me.username)}catch(e){toast(e.message)}}
function watchFeed(){let u=db.collection("posts").orderBy("createdAt","desc").limit(60).onSnapshot(s=>{let out="";s.forEach(doc=>{let p=doc.data(),id=doc.id,liked=(p.likes||[]).includes(me.uid),saved=(p.savedBy||[]).includes(me.uid);out+=`<article class="post panel"><div class="posthead"><img class="avatar" src="${esc(p.authorAvatar)}"><div><b>@${esc(p.authorUsername)}</b><div class="muted">${p.createdAt?.toDate?.().toLocaleString()||"Just now"}</div></div><span style="margin-left:auto" class="badge">WDM</span></div>${p.mediaType==="video"?`<video class="media" controls playsinline src="${esc(p.mediaUrl)}"></video>`:`<img class="media" loading="lazy" src="${esc(p.mediaUrl)}">`}<div class="postbody"><div class="actions"><button onclick="likePost('${id}')">${liked?"❤️":"♡"}</button><button onclick="commentPost('${id}')">◯</button><button onclick="sharePost('${id}')">↗</button><button style="margin-left:auto" onclick="savePost('${id}')">${saved?"▣":"▢"}</button></div><b>${(p.likes||[]).length} likes</b><div class="caption"><b>@${esc(p.authorUsername)}</b> ${esc(p.caption||"")} <span class="badge">${esc(p.hashtags||"")}</span></div><div class="muted" style="margin-top:7px" id="comments-${id}">${p.commentCount||0} comments</div><div class="commentline"><input id="c-${id}" placeholder="Add a comment…"><button onclick="addComment('${id}')">Post</button></div></div></article>`});$("feed").innerHTML=out||'<div class="empty panel">Abhi koi post nahi hai. Pehli post share karo!</div>'});unsubs.push(u)}
async function likePost(id){let r=db.collection("posts").doc(id);await db.runTransaction(async t=>{let d=await t.get(r);if(!d.exists)return;let a=d.data().likes||[];t.update(r,{likes:a.includes(me.uid)?FV.arrayRemove(me.uid):FV.arrayUnion(me.uid)})})}
async function savePost(id){await db.collection("posts").doc(id).update({savedBy:FV.arrayUnion(me.uid)});toast("Saved")}
async function commentPost(id){$("c-"+id)?.focus()}
async function addComment(id){let input=$("c-"+id),text=input.value.trim();if(!text)return;await db.collection("posts").doc(id).collection("comments").add({uid:me.uid,username:me.username,text,createdAt:FV.serverTimestamp()});await db.collection("posts").doc(id).update({commentCount:FV.increment(1)});input.value="";toast("Comment added")}
async function sharePost(id){let url=location.origin+location.pathname+"?post="+id;try{await navigator.clipboard.writeText(url);toast("Post link copied")}catch{toast(url)}}
function watchStories(){let u=db.collection("stories").where("expiresAt",">",firebase.firestore.Timestamp.now()).orderBy("expiresAt").onSnapshot(s=>{let h=`<div class="story" onclick="addStory()"><div class="ring"><img src="${esc(me.avatar)}"></div>Your story +</div>`;s.forEach(d=>{let x=d.data();h+=`<div class="story" onclick="viewStory('${d.id}')"><div class="ring"><img src="${esc(x.avatar)}"></div>${esc(x.username)}</div>`});$("stories").innerHTML=h});unsubs.push(u)}
async function addStory(){let f=document.createElement("input");f.type="file";f.accept="image/*,video/*";f.onchange=async()=>{try{let m=await upload(f.files[0]);await db.collection("stories").add({uid:me.uid,username:me.username,avatar:me.avatar,url:m.url,type:m.type,createdAt:FV.serverTimestamp(),expiresAt:firebase.firestore.Timestamp.fromDate(new Date(Date.now()+86400000))});toast("Story added for 24 hours")}catch(e){toast(e.message)}};f.click()}
async function viewStory(id){let d=await db.collection("stories").doc(id).get();if(!d.exists)return;let s=d.data();$("modalContent").innerHTML=`<h3>@${esc(s.username)}'s story</h3>${s.type==="video"?`<video class="media" controls src="${esc(s.url)}"></video>`:`<img class="media" src="${esc(s.url)}">`}<button onclick="closeModal()">Close</button>${s.uid===me.uid?`<button onclick="deleteStory('${id}')">Delete</button>`:""}`;showModal()}
async function deleteStory(id){await db.collection("stories").doc(id).delete();closeModal()}
function watchNotifications(){let u=db.collection("notifications").where("receiverId","==",me.uid).orderBy("createdAt","desc").limit(40).onSnapshot(s=>{$("notifications").innerHTML=s.empty?'<div class="empty">No activity yet.</div>':s.docs.map(d=>`<div class="listitem">${esc(d.data().text||"New activity")}</div>`).join("")});unsubs.push(u)}
async function loadProfile(){let s=await db.collection("posts").where("authorId","==",me.uid).get();$("profileStats").textContent=`${s.size} posts · ${(me.followers||[]).length} followers · ${(me.following||[]).length} following`;$("myPosts").innerHTML=s.docs.map(d=>`<div class="listitem">${esc(d.data().caption||"Post")} · <a href="${esc(d.data().mediaUrl)}" target="_blank">Open media</a></div>`).join("")}
function editProfile(){$("modalContent").innerHTML=`<h3>Edit profile</h3><input id="editName" class="field" value="${esc(me.fullName)}"><input id="editBio" class="field" value="${esc(me.bio||"")}" placeholder="Bio"><button class="primary" onclick="saveProfile()">Save</button><button onclick="closeModal()">Cancel</button>`;showModal()}
async function saveProfile(){let fullName=$("editName").value.trim(),bio=$("editBio").value.trim();if(!fullName)return toast("Name required");await db.collection("users").doc(me.uid).update({fullName,bio});me.fullName=fullName;me.bio=bio;paintUser();closeModal();toast("Profile updated")}
function pickAvatar(){$("avatarFile").click()}$("avatarFile").onchange=async e=>{try{let m=await upload(e.target.files[0]);await db.collection("users").doc(me.uid).update({avatar:m.url});me.avatar=m.url;paintUser();toast("Photo updated")}catch(x){toast(x.message)}};
async function searchAll(q){q=q.trim().toLowerCase();if(!q){$("searchResults").innerHTML="";return}let [users,posts]=await Promise.all([db.collection("users").limit(100).get(),db.collection("posts").limit(100).get()]);let html="";users.forEach(d=>{let u=d.data();if(u.username?.includes(q)||u.fullName?.toLowerCase().includes(q))html+=`<div class="listitem"><img class="avatar" src="${esc(u.avatar)}"> <b>@${esc(u.username)}</b> <button onclick="followUser('${d.id}')">Follow</button></div>`});posts.forEach(d=>{let p=d.data();if(p.caption?.toLowerCase().includes(q)||p.hashtags?.toLowerCase().includes(q))html+=`<div class="listitem">@${esc(p.authorUsername)} — ${esc(p.caption)}</div>`});$("searchResults").innerHTML=html||'<div class="empty">No matches</div>'}
async function followUser(uid){if(uid===me.uid)return;let target=db.collection("users").doc(uid),mine=db.collection("users").doc(me.uid);await db.runTransaction(async t=>{let a=await t.get(target),b=await t.get(mine);if(!a.exists||!b.exists)return;let followers=a.data().followers||[],following=b.data().following||[];if(following.includes(uid)){t.update(mine,{following:FV.arrayRemove(uid)});t.update(target,{followers:FV.arrayRemove(me.uid)})}else{t.update(mine,{following:FV.arrayUnion(uid)});t.update(target,{followers:FV.arrayUnion(me.uid)});t.set(db.collection("notifications").doc(),{receiverId:uid,text:"@"+me.username+" followed you",createdAt:FV.serverTimestamp()})}});toast("Follow status updated")}
async function loadSaved(){let s=await db.collection("posts").where("savedBy","array-contains",me.uid).get();$("savedPosts").innerHTML=s.docs.map(d=>`<div class="listitem">@${esc(d.data().authorUsername)} — ${esc(d.data().caption)} <a href="${esc(d.data().mediaUrl)}" target="_blank">Open</a></div>`).join("")||'<div class="empty">No saved posts</div>'}
function pairId(a,b){return [a,b].sort().join("_")}
async function openDM(){let name=$("messageUser").value.trim().replace(/^@/,"").toLowerCase();if(!name)return;let s=await db.collection("users").where("username","==",name).limit(1).get();if(s.empty)return toast("User not found");let uid=s.docs[0].id;if(uid===me.uid)return toast("Choose another user");activeDM=pairId(me.uid,uid);$("dmArea").innerHTML=`<h3>Chat with @${esc(name)}</h3><div id="dmMessages"></div><div class="commentline"><input id="dmText" placeholder="Message…"><button onclick="sendDM('${uid}')">Send</button></div>`;if(window.dmUnsub)window.dmUnsub();window.dmUnsub=db.collection("chats").doc(activeDM).collection("messages").orderBy("createdAt","asc").limit(100).onSnapshot(s=>{$("dmMessages").innerHTML=s.docs.map(d=>`<div class="listitem">${d.data().senderId===me.uid?"You":esc(d.data().senderName)}: ${esc(d.data().text)}</div>`).join("")})}
async function sendDM(uid){let v=$("dmText").value.trim();if(!v)return;let id=activeDM;await db.collection("chats").doc(id).set({members:[me.uid,uid],updatedAt:FV.serverTimestamp()},{merge:true});await db.collection("chats").doc(id).collection("messages").add({senderId:me.uid,senderName:me.username,text:v,createdAt:FV.serverTimestamp()});$("dmText").value=""}
async function notifyTelegram(message){if(!TELEGRAM_WORKER_URL)return;try{await fetch(TELEGRAM_WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})})}catch(e){console.warn("Telegram notification unavailable",e)}}
</script>
</body></html>
