<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>wdm - Community & Social Media</title>
  
  <!-- SEO & Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="shortcut icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta name="description" content="wdm - Official community and social media portal. Connect, share photos, stories, and chat with members.">
  <meta name="robots" content="index, follow">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #121212;
      --border: #262626;
      --accent: #0095f6;
      --accent-hover: #1877f2;
      --like: #ed4956;
      --text-main: #f5f5f5;
      --text-muted: #8e8e8e;
      --online: #31a24c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 65px;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      height: 52px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      color: var(--text-main);
      font-size: 1.15rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 1.3rem;
    }

    .header-actions i {
      cursor: pointer;
    }

    /* Stories Bar */
    .stories-container {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .stories-container::-webkit-scrollbar { display: none; }

    .story-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 66px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .story-ring.add-story {
      background: #333;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #000;
    }

    .add-story-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
    }

    .story-username {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Feed Layout */
    .content-feed {
      max-width: 500px;
      margin: 0 auto;
    }

    .post-card {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 8px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .post-author-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-author-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .post-media-box {
      width: 100%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 520px;
      overflow: hidden;
    }

    .post-media-box img, .post-media-box video {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
    }

    .post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      font-size: 1.35rem;
    }

    .post-actions-left {
      display: flex;
      gap: 16px;
    }

    .post-actions i {
      cursor: pointer;
    }

    .post-actions i.liked {
      color: var(--like);
    }
    .post-stats {
      padding: 0 14px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
    }

    .post-caption {
      padding: 0 14px;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .post-caption strong {
      margin-right: 6px;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #000;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      font-size: 1.3rem;
    }

    .nav-btn {
      color: var(--text-muted);
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--text-main);
    }

    /* Modals & Dialogs */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 250;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid var(--border);
      color: #fff;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-google {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.92rem;
    }

    /* Progress bar */
    .progress-box {
      display: none;
      margin: 10px 0;
    }

    .progress-track {
      background: #262626;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    /* Profile Section */
    .profile-view {
      display: none;
      padding: 16px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .profile-avatar-box {
      position: relative;
      width: 80px;
      height: 80px;
      cursor: pointer;
    }

    .profile-avatar-box img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .avatar-edit-icon {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      border: 2px solid #000;
    }

    .profile-metrics {
      display: flex;
      gap: 22px;
      text-align: center;
    }

    .metric-num {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .metric-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .profile-bio-box {
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-top: 16px;
    }

    .profile-grid-item {
      aspect-ratio: 1;
      background: #181818;
      overflow: hidden;
    }

    .profile-grid-item img, .profile-grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Chat Section */
    .chat-view {
      display: none;
      height: calc(100vh - 120px);
      flex-direction: column;
    }

    .online-users-bar {
      display: flex;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .online-user-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .online-avatar-wrap {
      width: 44px;
      height: 44px;
      position: relative;
    }

    .online-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      }
    .online-dot {
      width: 10px;
      height: 10px;
      background: var(--online);
      border-radius: 50%;
      position: absolute;
      bottom: 1px;
      right: 1px;
      border: 2px solid #000;
    }

    .chat-msgs-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 0.88rem;
      word-break: break-word;
    }

    .chat-msg.mine {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }

    .chat-msg.theirs {
      align-self: flex-start;
      background: #262626;
      color: #fff;
    }

    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-section">
      <!-- Direct Back to Portal -->
      <a href="index.html" class="btn-back" title="Back to Portal">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="brand-title">wdm</span>
    </div>
    <div class="header-actions">
      <i class="fa-regular fa-heart" onclick="switchNavTab('notif')"></i>
      <i class="fa-brands fa-facebook-messenger" onclick="switchNavTab('chat')"></i>
    </div>
  </header>

  <!-- Stories Bar -->
  <div class="stories-container" id="storiesBar">
    <div class="story-bubble" onclick="openStoryDirectPicker()">
      <div class="story-ring add-story">
        <img id="myStoryAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="You">
        <div class="add-story-badge"><i class="fa-solid fa-plus"></i></div>
      </div>
      <span class="story-username">Your Story</span>
    </div>
    <div id="dynamicStoriesList" style="display: flex; gap: 14px;"></div>
  </div>

  <!-- Feed Section -->
  <main class="content-feed" id="feedSection">
    <div id="feedPostsContainer"></div>
  </main>

  <!-- Search Section -->
  <section class="content-feed" id="searchSection" style="display: none; padding: 14px;">
    <input type="text" id="searchInputField" class="form-control" placeholder="Search users, posts or captions..." oninput="handleGlobalSearch(this.value)">
    <div id="searchResultsList" style="margin-top: 14px;"></div>
  </section>

  <!-- Chat Section -->
  <section class="content-feed chat-view" id="chatSection">
    <div class="online-users-bar" id="onlineUsersTray"></div>
    <div class="chat-msgs-box" id="chatMessagesWrapper"></div>
    <div class="chat-input-bar">
      <input type="text" id="chatTextEntry" class="form-control" placeholder="Type a message...">
      <button class="btn-main" style="width: auto; padding: 0 16px;" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </section>

  <!-- Notifications Section -->
  <section class="content-feed" id="notifSection" style="display: none; padding: 16px;">
    <h3 style="font-size: 1.1rem; margin-bottom: 14px;">Activity</h3>
    <div id="notifItemsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
  </section>

  <!-- Profile Section -->
  <section class="content-feed profile-view" id="profileSection">
    <div class="profile-top">
      <div class="profile-avatar-box" onclick="openAvatarDirectPicker()">
        <img id="profileUserAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar">
        <div class="avatar-edit-icon"><i class="fa-solid fa-camera"></i></div>
      </div>
      <div class="profile-metrics">
        <div>
          <div class="metric-num" id="profilePostCount">0</div>
          <div class="metric-lbl">Posts</div>
        </div>
        <div>
          <div class="metric-num" id="profileFollowerCount">120</div>
          <div class="metric-lbl">Followers</div>
        </div>
        <div>
          <div class="metric-num" id="profileFollowingCount">85</div>
          <div class="metric-lbl">Following</div>
        </div>
      </div>
    </div>

    <div class="profile-bio-box">
      <div style="font-weight: 700;" id="profileNameDisplay">User</div>
      <div style="color: var(--text-muted);" id="profileHandleDisplay">@user</div>
      <div id="profileBioDisplay" style="margin-top: 4px;">Community member.</div>
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="btn-main" style="background: #242424; font-size: 0.85rem; padding: 9px;" onclick="openProfileEditDialog()">Edit Profile</button>
      <button class="btn-main" style="background: #242424; color: var(--like); font-size: 0.85rem; padding: 9px;" onclick="performLogout()">Logout</button>
    </div>

    <div class="profile-grid" id="profilePostsGrid"></div>
  </section>

  <!-- Bottom App Navigation Bar -->
  <nav class="bottom-nav">
    <i class="fa-solid fa-house nav-btn active" id="tabHome" onclick="switchNavTab('feed')"></i>
    <i class="fa-solid fa-magnifying-glass nav-btn" id="tabSearch" onclick="switchNavTab('search')"></i>
    <i class="fa-regular fa-square-plus nav-btn" onclick="openPostDirectPicker()"></i>
    <i class="fa-solid fa-user nav-btn" id="tabProfile" onclick="switchNavTab('profile')"></i>
  </nav>

  <!-- Hidden Native File Inputs -->
  <input type="file" id="postFileInputHidden" accept="image/*,video/*" style="display:none;" onchange="onPostFilePicked(this)">
  <input type="file" id="storyFileInputHidden" accept="image/*,video/*" style="display:none;" onchange="onStoryFilePicked(this)">
  <input type="file" id="avatarFileInputHidden" accept="image/*" style="display:none;" onchange="onAvatarFilePicked(this)">

  <!-- MODALS -->

  <!-- 1. Post Preview & Caption Modal -->
  <div class="modal-overlay" id="postPreviewModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>Create Post</span>
        <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('postPreviewModal')"></i>
      </div>
      <div id="postPreviewBox" style="width: 100%; max-height: 240px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;"></div>
      <div class="form-group">
        <label>Caption</label>
        <textarea id="postCaptionText" class="form-control" rows="3" placeholder="Write a caption..."></textarea>
      </div>
      <div class="progress-box" id="postUploadProgress">
        <div class="progress-track"><div class="progress-fill" id="postProgressFill"></div></div>
      </div>
      <button class="btn-main" id="btnUploadSubmit" onclick="confirmPostUpload()">Share</button>
    </div>
  </div>

  <!-- 2. Auth Gateway Modal -->
  <div class="modal-overlay" id="authGatewayModal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="authTitle">Welcome to wdm</span>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button id="btnTabRegister" class="btn-main" style="padding: 8px; font-size: 0.85rem;" onclick="setAuthTab('register')">Create Account</button>
        <button id="btnTabLogin" class="btn-main" style="padding: 8px; font-size: 0.85rem; background: #262626;" onclick="setAuthTab('login')">Login</button>
      </div>

      <!-- Register Fields -->
      <div id="registerFieldsBox">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="regFullName" class="form-control" placeholder="e.g. Alex Smith">
        </div>
        <div class="form-group">
          <label>Unique User ID *</label>
          <input type="text" id="regUserId" class="form-control" placeholder="e.g. abc_user">
        </div>
        <div class="form-group">
          <label>Date of Birth *</label>
          <input type="date" id="regDob" class="form-control">
        </div>
      </div>

      <!-- Login Unique Field -->
      <div id="loginFieldsBox" style="display: none;">
        <div class="form-group">
          <label>User ID *</label>
          <input type="text" id="loginUserId" class="form-control" placeholder="Enter User ID">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="authPassword" class="form-control" placeholder="At least 6 characters">
      </div>

      <button class="btn-main" id="authActionButton" onclick="submitAuthForm()">Continue</button>

      <div style="text-align: center; margin: 12px 0; color: var(--text-muted); font-size: 0.8rem;">OR</div>

      <button class="btn-google" onclick="initiateGoogleLogin()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        Continue with Google
      </button>
    </div>
  </div>

    <!-- 3. Google First-Time Onboarding Modal -->
  <div class="modal-overlay" id="googleOnboardModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>Complete Your Profile</span>
      </div>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">Please set your unique User ID and details to finish registration.</p>
      
      <div class="form-group">
        <label>Unique User ID *</label>
        <input type="text" id="onboardUserId" class="form-control" placeholder="e.g. user_abc">
      </div>
      <div class="form-group">
        <label>Date of Birth *</label>
        <input type="date" id="onboardDob" class="form-control">
      </div>
      <div class="form-group">
        <label>Set Password *</label>
        <input type="password" id="onboardPass" class="form-control" placeholder="Set password for direct login">
      </div>
      <div class="form-group">
        <label>Bio</label>
        <input type="text" id="onboardBio" class="form-control" placeholder="Short bio...">
      </div>

      <button class="btn-main" onclick="submitGoogleOnboarding()">Complete Setup</button>
    </div>
  </div>

  <!-- 4. Edit Profile Modal -->
  <div class="modal-overlay" id="profileEditModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>Edit Profile</span>
        <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('profileEditModal')"></i>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="editFullName" class="form-control">
      </div>
      <div class="form-group">
        <label>User ID</label>
        <input type="text" id="editUserId" class="form-control">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="editDob" class="form-control">
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="editBio" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Change Password (Optional)</label>
        <input type="password" id="editNewPass" class="form-control" placeholder="New password">
      </div>

      <button class="btn-main" onclick="saveProfileChanges()">Save Changes</button>
    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    // --- 1. CONFIGURATION ---
    const CLOUDINARY_CLOUD_NAME = "afcw94ij";
    const CLOUDINARY_UPLOAD_PRESET = "wdm_media";

    // Optional Telegram Bot notifications
    const TELEGRAM_CONFIG = {
      botToken: "", // Apna Telegram Bot Token daalein (Optional)
      chatId: ""    // Apna Chat ID daalein (Optional)
    };

    let firebaseConfig = {
      apiKey: "AIzaSy_CONFIG_DEFAULT",
      authDomain: "wdm-update.firebaseapp.com",
      projectId: "wdm-update",
      storageBucket: "wdm-update.appspot.com",
      messagingSenderId: "100000000000",
      appId: "1:100000000000:web:default"
    };

    let auth, db;
    let currentUser = null;
    let currentAuthTab = "register";
    let pendingFileToUpload = null;
    let tempGoogleUser = null;

    // --- 2. DUMMY STARTER POSTS ---
    const STARTER_POSTS = [
      {
        id: "starter_1",
        authorName: "wdm Community",
        authorUsername: "wdm_official",
        authorAvatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80",
        mediaUrl: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800&auto=format&fit=crop&q=80",
        mediaType: "image",
        caption: "Welcome to wdm official digital platform! Share updates and stay connected.",
        likes: ["usr_1", "usr_2"],
        views: 312,
        createdAt: new Date()
      },
      {
        id: "starter_2",
        authorName: "Sports & Fitness",
        authorUsername: "sports_hub",
        authorAvatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80",
        mediaUrl: "https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=800&auto=format&fit=crop&q=80",
        mediaType: "image",
        caption: "Local championship matches beginning this week. Keep cheering! 🏏",
        likes: ["usr_3"],
        views: 180,
        createdAt: new Date()
      }
    ];

    // --- 3. AUTO-LOAD CONFIG FROM index.html ---
    async function initApp() {
      try {
        const resp = await fetch("index.html");
        if (resp.ok) {
          const txt = await resp.text();
          const match = txt.match(/firebaseConfig\s*=\s*({[\s\S]*?});/);
          if (match && match[1]) {
            firebaseConfig = (new Function("return " + match[1]))();
          }
        }
      } catch (e) {
        console.log("Using fallback config.");
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();

      setupAuthObserver();
    }

    initApp();

    // --- 4. TELEGRAM ALERT HELPER ---
    function sendTelegramAlert(text) {
      if (!TELEGRAM_CONFIG.botToken || !TELEGRAM_CONFIG.chatId) return;
      fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: TELEGRAM_CONFIG.chatId, text: `[wdm Alert]\n${text}` })
      }).catch(e => console.warn(e));
    }

     // --- 5. AUTH LOGIC ---
    function setupAuthObserver() {
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection("users").doc(user.uid).get();
          if (doc.exists) {
            currentUser = { uid: user.uid, ...doc.data() };
            finalizeLogin();
          } else {
            // New Google user: Prompt onboarding
            tempGoogleUser = user;
            document.getElementById("authGatewayModal").classList.remove("active");
            document.getElementById("googleOnboardModal").classList.add("active");
          }
        } else {
          document.getElementById("authGatewayModal").classList.add("active");
        }
      });
    }

    function setAuthTab(tab) {
      currentAuthTab = tab;
      const regBox = document.getElementById("registerFieldsBox");
      const logBox = document.getElementById("loginFieldsBox");
      const regBtn = document.getElementById("btnTabRegister");
      const logBtn = document.getElementById("btnTabLogin");

      if (tab === "register") {
        regBox.style.display = "block";
        logBox.style.display = "none";
        regBtn.style.background = "var(--accent)";
        logBtn.style.background = "#262626";
      } else {
        regBox.style.display = "none";
        logBox.style.display = "block";
        logBtn.style.background = "var(--accent)";
        regBtn.style.background = "#262626";
      }
    }

    async function submitAuthForm() {
      const pass = document.getElementById("authPassword").value.trim();
      if (!pass || pass.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      if (currentAuthTab === "register") {
        const fullName = document.getElementById("regFullName").value.trim();
        const username = document.getElementById("regUserId").value.trim().toLowerCase();
        const dob = document.getElementById("regDob").value;

        if (!fullName || !username || !dob) {
          alert("Please fill all required fields.");
          return;
        }

        const check = await db.collection("users").where("username", "==", username).get();
        if (!check.empty) {
          alert("already exists");
          return;
        }

        const email = `${username}@wdm.local`;
        try {
          const res = await auth.createUserWithEmailAndPassword(email, pass);
          const userData = {
            fullName,
            username,
            dob,
            bio: "Community member.",
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
            followers: [],
            following: []
          };
          await db.collection("users").doc(res.user.uid).set(userData);
          currentUser = { uid: res.user.uid, ...userData };
          sendTelegramAlert(`New User Registered: ${fullName} (@${username})`);
          finalizeLogin();
        } catch (e) {
          if (e.code === "auth/email-already-in-use") {
            alert("already exists");
          } else {
            alert("Error: " + e.message);
          }
        }
      } else {
        const username = document.getElementById("loginUserId").value.trim().toLowerCase();
        if (!username) { alert("Enter User ID"); return; }
        try {
          await auth.signInWithEmailAndPassword(`${username}@wdm.local`, pass);
        } catch (e) {
          alert("Invalid User ID or Password!");
        }
      }
    }

    async function initiateGoogleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (e) {
        if (e.code !== "auth/popup-closed-by-user") alert(e.message);
      }
    }

    async function submitGoogleOnboarding() {
      const username = document.getElementById("onboardUserId").value.trim().toLowerCase();
      const dob = document.getElementById("onboardDob").value;
      const pass = document.getElementById("onboardPass").value.trim();
      const bio = document.getElementById("onboardBio").value.trim() || "Community member.";

      if (!username || !dob || !pass) {
        alert("Please fill all required onboarding fields.");
        return;
      }

      const check = await db.collection("users").where("username", "==", username).get();
      if (!check.empty) {
        alert("already exists");
        return;
      }

      const userData = {
        fullName: tempGoogleUser.displayName || "Google User",
        username: username,
        dob: dob,
        bio: bio,
        avatar: tempGoogleUser.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
        followers: [],
        following: []
      };

      await db.collection("users").doc(tempGoogleUser.uid).set(userData);
      currentUser = { uid: tempGoogleUser.uid, ...userData };
      closeModal("googleOnboardModal");
      sendTelegramAlert(`Google User Setup Complete: @${username}`);
      finalizeLogin();
    }

    function finalizeLogin() {
      closeModal("authGatewayModal");
      closeModal("googleOnboardModal");

      document.getElementById("profileNameDisplay").innerText = currentUser.fullName || "User";
      document.getElementById("profileHandleDisplay").innerText = "@" + (currentUser.username || "user");
      document.getElementById("profileBioDisplay").innerText = currentUser.bio || "";
      if (currentUser.avatar) {
        document.getElementById("profileUserAvatar").src = currentUser.avatar;
        document.getElementById("myStoryAvatar").src = currentUser.avatar;
      }

      initFeedWatcher();
      initStoriesWatcher();
      initChatWatcher();
      loadProfileGrid();
    }

    function performLogout() {
      auth.signOut().then(() => location.reload());
    }

    // --- 6. CLOUDINARY UPLOAD ---
    async function uploadToCloudinary(file, progressCb) {
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url, true);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && progressCb) {
            progressCb(Math.round((e.loaded / e.total) * 100));
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            resolve(JSON.parse(xhr.responseText).secure_url);
          } else {
            reject("Cloudinary upload rejected.");
          }
        };
        xhr.onerror = () => reject("Network error");
        xhr.send(fd);
      });
    }

    // --- 7. DIRECT PICKERS (POST & STORY & AVATAR) ---
    function openPostDirectPicker() {
      document.getElementById("postFileInputHidden").click();
    }

    function onPostFilePicked(input) {
      if (input.files && input.files[0]) {
        pendingFileToUpload = input.files[0];
        const preview = document.getElementById("postPreviewBox");
        preview.innerHTML = "";
        const url = URL.createObjectURL(pendingFileToUpload);

        if (pendingFileToUpload.type.startsWith("video/")) {
          const v = document.createElement("video");
          v.src = url; v.controls = true; v.style.maxHeight = "240px";
          preview.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.src = url; img.style.maxHeight = "240px";
          preview.appendChild(img);
        }
        document.getElementById("postPreviewModal").classList.add("active");
      }
    }

    async function confirmPostUpload() {
      if (!pendingFileToUpload) return;
      const btn = document.getElementById("btnUploadSubmit");
      const progBox = document.getElementById("postUploadProgress");
      const progFill = document.getElementById("postProgressFill");

      try {
        btn.disabled = true;
        progBox.style.display = "block";

        const url = await uploadToCloudinary(pendingFileToUpload, (p) => {
          progFill.style.width = p + "%";
        });

        const isVid = pendingFileToUpload.type.startsWith("video/");
        const cap = document.getElementById("postCaptionText").value.trim();

        await db.collection("posts").add({
          authorId: currentUser.uid,
          authorName: currentUser.fullName,
          authorUsername: currentUser.username,
          authorAvatar: currentUser.avatar,
          mediaUrl: url,
          mediaType: isVid ? "video" : "image",
          caption: cap,
          likes: [],
          views: 1,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        sendTelegramAlert(`New Post by @${currentUser.username}: "${cap}"`);
        closeModal("postPreviewModal");
        pendingFileToUpload = null;
        document.getElementById("postCaptionText").value = "";
        progBox.style.display = "none";
        loadProfileGrid();
      } catch (e) {
        alert("Upload error: " + e);
      } finally {
        btn.disabled = false;
      }
    }

    function openStoryDirectPicker() {
      document.getElementById("storyFileInputHidden").click();
    }

    async function onStoryFilePicked(input) {
      if (input.files && input.files[0]) {
        try {
          const url = await uploadToCloudinary(input.files[0]);
          await db.collection("stories").add({
            userId: currentUser.uid,
            authorUsername: currentUser.username,
            authorAvatar: currentUser.avatar,
            mediaUrl: url,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          sendTelegramAlert(`New Story from @${currentUser.username}`);
          alert("Story uploaded successfully!");
        } catch (e) {
          alert("Story upload failed: " + e);
        }
      }
    }

    function openAvatarDirectPicker() {
      document.getElementById("avatarFileInputHidden").click();
    }

    async function onAvatarFilePicked(input) {
      if (input.files && input.files[0]) {
        try {
          const url = await uploadToCloudinary(input.files[0]);
          await db.collection("users").doc(currentUser.uid).update({ avatar: url });
          currentUser.avatar = url;
          document.getElementById("profileUserAvatar").src = url;
          document.getElementById("myStoryAvatar").src = url;
          alert("Profile photo updated!");
        } catch (e) {
          alert("Avatar update failed: " + e);
        }
      }
    }

    // --- 8. FEED SUBSCRIPTION ---
    function initFeedWatcher() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snap => {
        const wrap = document.getElementById("feedPostsContainer");
        wrap.innerHTML = "";

        const list = [];
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
        const renderData = list.length > 0 ? list : STARTER_POSTS;

        renderData.forEach(p => {
          const isLiked = p.likes && p.likes.includes(currentUser.uid);
          const card = document.createElement("div");
          card.className = "post-card";
          card.innerHTML = `
            <div class="post-header">
              <div class="post-author-box">
                <img src="${p.authorAvatar}" class="avatar-sm" alt="Author">
                <span class="post-author-name">${p.authorUsername}</span>
              </div>
            </div>
            <div class="post-media-box">
              ${p.mediaType === "video" 
                ? `<video src="${p.mediaUrl}" controls playsinline></video>` 
                : `<img src="${p.mediaUrl}" loading="lazy" alt="Media">`}
            </div>
            <div class="post-actions">
              <div class="post-actions-left">
                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}')"></i>
                <i class="fa-regular fa-comment" onclick="promptComment('${p.id}')"></i>
                <i class="fa-regular fa-paper-plane" onclick="shareMediaLink('${p.id}')"></i>
              </div>
            </div>
            <div class="post-stats">
              <span>${(p.likes || []).length} likes</span>
              <span>${p.views || 1} views</span>
            </div>
            <div class="post-caption">
              <strong>${p.authorUsername}</strong>${p.caption || ""}
            </div>
          `;
          wrap.appendChild(card);
        });
      });
    }

    async function toggleLike(postId) {
      if (postId.startsWith("starter_")) return;
      const ref = db.collection("posts").doc(postId);
      const doc = await ref.get();
      if (!doc.exists) return;

      const likes = doc.data().likes || [];
      const uid = currentUser.uid;

      if (likes.includes(uid)) {
        await ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(uid) });
      } else {
        await ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(uid) });
        if (doc.data().authorId !== uid) {
          db.collection("notifications").add({
            receiverId: doc.data().authorId,
            text: `@${currentUser.username} liked your post.`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          sendTelegramAlert(`@${currentUser.username} liked a post.`);
        }
      }
    }

    function promptComment(postId) {
      const c = prompt("Add a comment:");
      if (c && !postId.startsWith("starter_")) {
        alert("Comment added!");
      }
    }

    function shareMediaLink(postId) {
      navigator.clipboard.writeText(window.location.href);
      alert("Post link copied to clipboard!");
    }

    // --- 9. STORIES WATCHER ---
    function initStoriesWatcher() {
      db.collection("stories").orderBy("createdAt", "desc").onSnapshot(snap => {
        const tray = document.getElementById("dynamicStoriesList");
        tray.innerHTML = "";

        snap.forEach(d => {
          const s = d.data();
          const bubble = document.createElement("div");
          bubble.className = "story-bubble";
          bubble.innerHTML = `
            <div class="story-ring" onclick="showStoryPrompt('${s.mediaUrl}', '${s.authorUsername}', '${d.id}', '${s.userId}')">
              <img src="${s.authorAvatar}">
            </div>
            <span class="story-username">${s.authorUsername}</span>
          `;
          tray.appendChild(bubble);
        });
      });
    }

    function showStoryPrompt(url, username, storyId, ownerId) {
      const isMe = ownerId === currentUser.uid;
      const act = prompt(`Story by @${username}\nType 'R' to send ❤️\nType 'D' to delete (owner only):`);
      if (act && act.toUpperCase() === 'D' && isMe) {
        db.collection("stories").doc(storyId).delete();
        alert("Story deleted.");
      } else if (act && act.toUpperCase() === 'R') {
        alert("Sent ❤️ reaction!");
        sendTelegramAlert(`@${currentUser.username} reacted to @${username}'s story`);
      }
    }

    // --- 10. CHAT WATCHER ---
    function initChatWatcher() {
      // Active users list
      document.getElementById("onlineUsersTray").innerHTML = `
        <div class="online-user-item">
          <div class="online-avatar-wrap">
            <img src="${currentUser.avatar}">
            <span class="online-dot"></span>
          </div>
          <span style="font-size:0.7rem; color:var(--text-muted);">You</span>
        </div>
      `;

      db.collection("messages").orderBy("createdAt", "asc").limitToLast(50).onSnapshot(snap => {
        const box = document.getElementById("chatMessagesWrapper");
        box.innerHTML = "";
        snap.forEach(d => {
          const m = d.data();
          const isMine = m.senderId === currentUser.uid;
          const div = document.createElement("div");
          div.className = `chat-msg ${isMine ? 'mine' : 'theirs'}`;
          div.innerText = `${isMine ? '' : '@' + m.senderUsername + ': '}${m.text}`;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    async function sendChatMessage() {
      const inp = document.getElementById("chatTextEntry");
      const val = inp.value.trim();
      if (!val) return;

      await db.collection("messages").add({
        text: val,
        senderId: currentUser.uid,
        senderUsername: currentUser.username,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      sendTelegramAlert(`Chat Msg from @${currentUser.username}: "${val}"`);
      inp.value = "";
    }

    // --- 11. PROFILE EDIT & GRID ---
    function openProfileEditDialog() {
      document.getElementById("editFullName").value = currentUser.fullName || "";
      document.getElementById("editUserId").value = currentUser.username || "";
      document.getElementById("editDob").value = currentUser.dob || "";
      document.getElementById("editBio").value = currentUser.bio || "";
      document.getElementById("profileEditModal").classList.add("active");
    }

    async function saveProfileChanges() {
      const name = document.getElementById("editFullName").value.trim();
      const user = document.getElementById("editUserId").value.trim().toLowerCase();
      const dob = document.getElementById("editDob").value;
      const bio = document.getElementById("editBio").value.trim();
      const pass = document.getElementById("editNewPass").value.trim();

      if (!name || !user) { alert("Name and User ID are required."); return; }

      if (user !== currentUser.username) {
        const c = await db.collection("users").where("username", "==", user).get();
        if (!c.empty) { alert("already exists"); return; }
      }

      const patch = { fullName: name, username: user, dob: dob, bio: bio };
      await db.collection("users").doc(currentUser.uid).update(patch);
      currentUser = { ...currentUser, ...patch };

      if (pass && pass.length >= 6) {
        auth.currentUser.updatePassword(pass).catch(e => alert("Password update requires recent login."));
      }

      document.getElementById("profileNameDisplay").innerText = name;
      document.getElementById("profileHandleDisplay").innerText = "@" + user;
      document.getElementById("profileBioDisplay").innerText = bio;

      closeModal("profileEditModal");
      alert("Profile updated!");
    }

    async function loadProfileGrid() {
      const grid = document.getElementById("profilePostsGrid");
      const count = document.getElementById("profilePostCount");
      const snap = await db.collection("posts").where("authorId", "==", currentUser.uid).get();

      grid.innerHTML = "";
      count.innerText = snap.size;

      snap.forEach(d => {
        const p = d.data();
        const div = document.createElement("div");
        div.className = "profile-grid-item";
        div.innerHTML = p.mediaType === "video" ? `<video src="${p.mediaUrl}"></video>` : `<img src="${p.mediaUrl}">`;
        grid.appendChild(div);
      });
    }

    // --- 12. TAB SWITCHER ---
    function switchNavTab(tab) {
      document.getElementById("feedSection").style.display = tab === 'feed' ? 'block' : 'none';
      document.getElementById("searchSection").style.display = tab === 'search' ? 'block' : 'none';
      document.getElementById("chatSection").style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById("profileSection").style.display = tab === 'profile' ? 'block' : 'none';
      document.getElementById("notifSection").style.display = tab === 'notif' ? 'block' : 'none';

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      if (tab === 'feed') document.getElementById("tabHome").classList.add("active");
      if (tab === 'search') document.getElementById("tabSearch").classList.add("active");
      if (tab === 'profile') document.getElementById("tabProfile").classList.add("active");
    }

    async function handleGlobalSearch(q) {
      q = q.trim().toLowerCase();
      const res = document.getElementById("searchResultsList");
      res.innerHTML = "";
      if (!q) return;

      const snap = await db.collection("posts").get();
      snap.forEach(d => {
        const p = d.data();
        if ((p.caption && p.caption.toLowerCase().includes(q)) || (p.authorUsername && p.authorUsername.toLowerCase().includes(q))) {
          const r = document.createElement("div");
          r.style.padding = "8px"; r.style.background = "#181818"; r.style.borderRadius = "6px"; r.style.marginBottom = "6px";
          r.innerHTML = `<strong>@${p.authorUsername}</strong>: ${p.caption || 'Media'}`;
          res.appendChild(r);
        }
      });
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }
  </script>
