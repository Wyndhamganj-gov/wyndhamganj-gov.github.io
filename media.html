<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WDM Social Media</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase App SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --border-color: #262626;
      --primary-accent: #0095f6;
      --danger: #ed4956;
      --text-main: #f5f5f5;
      --text-muted: #8e8e8e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 65px;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      height: 52px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back-portal {
      color: var(--text-main);
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.25rem;
    }

    .header-actions i {
      cursor: pointer;
    }

    /* Stories Tray */
    .stories-container {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
    }
    .stories-container::-webkit-scrollbar { display: none; }

    .story-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 68px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-ring.add-story {
      background: var(--border-color);
      position: relative;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #000;
    }

    .story-username {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Post Feed Cards */
    .feed-container {
      max-width: 500px;
      margin: 0 auto;
    }

    .post-card {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 8px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .post-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-user-name {
      font-weight: 600;
      font-size: 0.88rem;
    }

    .post-media-box {
      width: 100%;
      max-height: 520px;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .post-media-box img, .post-media-box video {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
    }

    .post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      font-size: 1.35rem;
    }

    .post-actions-left {
      display: flex;
      gap: 16px;
    }

    .post-actions i {
      cursor: pointer;
    }

    .post-actions i.liked {
      color: var(--danger);
    }

    .post-stats {
      padding: 0 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
    }

    .post-caption {
      padding: 0 14px;
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .post-caption strong {
      margin-right: 6px;
    }

    /* Bottom Navigation Bar */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #000;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      font-size: 1.3rem;
    }

    .nav-btn {
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .nav-btn.active {
      color: var(--text-main);
    }

    /* Modals & Full Views */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: #202020;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary-accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-google {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      background: #262626;
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
      display: none;
    }

    .progress-bar-fill {
      width: 0%;
      height: 6px;
      background: var(--primary-accent);
      transition: width 0.2s ease;
    }

    /* Profile Section */
    .profile-container {
      display: none;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .profile-img-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-color);
    }

    .profile-metrics {
      display: flex;
      gap: 20px;
      text-align: center;
    }

    .metric-value {
      font-weight: 700;
      font-size: 1rem;
    }

    .metric-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .profile-bio-box {
      font-size: 0.88rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-top: 16px;
    }

    .profile-grid-item {
      aspect-ratio: 1;
      background: #181818;
      overflow: hidden;
    }

    .profile-grid-item img, .profile-grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Chat Section */
    .chat-container {
      display: none;
      max-width: 500px;
      margin: 0 auto;
      height: calc(100vh - 120px);
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 0.88rem;
      word-break: break-word;
    }

    .chat-msg.mine {
      align-self: flex-end;
      background: var(--primary-accent);
      color: #fff;
    }

       .chat-msg.theirs {
      align-self: flex-start;
      background: #262626;
      color: #fff;
    }

    .chat-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border-color);
    }

    /* Notification Tray */
    .notif-container {
      display: none;
      padding: 14px;
      max-width: 500px;
      margin: 0 auto;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-section">
      <!-- Back to Main Portal -->
      <a href="index.html" class="btn-back-portal" title="Back to Portal">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="brand-title">WDM</span>
    </div>
    <div class="header-actions">
      <i class="fa-regular fa-heart" onclick="switchTab('notifications')" title="Notifications"></i>
      <i class="fa-brands fa-facebook-messenger" onclick="switchTab('chat')" title="Messages"></i>
    </div>
  </header>

  <!-- Stories Tray -->
  <div class="stories-container" id="storiesTray">
    <!-- Story Add Button -->
    <div class="story-bubble" onclick="openStoryUploadModal()">
      <div class="story-ring add-story">
        <img id="myStoryAvatar" src="https://via.placeholder.com/64" alt="Me">
        <i class="fa-solid fa-plus" style="position: absolute; bottom: 2px; right: 2px; background: var(--primary-accent); border-radius: 50%; font-size: 11px; padding: 3px; color: #fff;"></i>
      </div>
      <span class="story-username">Your Story</span>
    </div>
    <!-- Dynamically loaded stories -->
    <div id="dynamicStories" style="display: flex; gap: 14px;"></div>
  </div>

  <!-- Main Feed View -->
  <main class="feed-container" id="feedView">
    <div id="postsList">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">loading...</p>
      </div>
    </div>
  </main>

  <!-- Search View -->
  <section class="feed-container" id="searchView" style="display: none; padding: 14px;">
    <input type="text" id="searchInput" class="form-control" placeholder="Search user, posts or captions..." oninput="handleSearch(this.value)">
    <div id="searchResults" style="margin-top: 14px;"></div>
  </section>

  <!-- Chat / Messages View -->
  <section class="chat-container" id="chatView">
    <div class="chat-messages" id="chatMessagesBox"></div>
    <div class="chat-bar">
      <input type="text" id="chatInputText" class="form-control" placeholder="Message likhein...">
      <button class="btn-submit" style="width: auto; padding: 0 16px; margin: 0;" onclick="sendDirectMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </section>

  <!-- Notifications View -->
  <section class="notif-container" id="notifView">
    <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Activity</h3>
    <div id="notifListBox">
      <p style="color: var(--text-muted); font-size: 0.85rem;">Not any Notification.</p>
    </div>
  </section>

  <!-- Profile View -->
  <section class="profile-container" id="profileView">
    <div class="profile-top">
      <img id="profileUserAvatar" src="https://via.placeholder.com/80" class="profile-img-large" alt="Profile">
      <div class="profile-metrics">
        <div>
          <div class="metric-value" id="profilePostsCount">0</div>
          <div class="metric-lbl">Posts</div>
        </div>
        <div>
          <div class="metric-value" id="profileFollowersCount">0</div>
          <div class="metric-lbl">Followers</div>
        </div>
        <div>
          <div class="metric-value" id="profileFollowingCount">0</div>
          <div class="metric-lbl">Following</div>
        </div>
      </div>
    </div>

    <div class="profile-bio-box">
      <div style="font-weight: 700;" id="profileFullnameDisplay">User Name</div>
      <div style="color: var(--text-muted);" id="profileUsernameDisplay">@username</div>
      <div id="profileBioDisplay" style="margin-top: 4px;">WDM MEDIA.</div>
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="btn-submit" style="background: #262626; color: #fff; font-size: 0.85rem; padding: 8px;" onclick="openEditProfileModal()">Edit Profile</button>
      <button class="btn-submit" style="background: #262626; color: var(--danger); font-size: 0.85rem; padding: 8px;" onclick="handleUserLogout()">Logout</button>
    </div>

    <div class="profile-grid" id="profilePostsGrid"></div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <i class="fa-solid fa-house nav-btn active" onclick="switchTab('feed')" id="navHome"></i>
    <i class="fa-solid fa-magnifying-glass nav-btn" onclick="switchTab('search')" id="navSearch"></i>
    <i class="fa-regular fa-square-plus nav-btn" onclick="openCreatePostModal()" id="navAdd"></i>
    <i class="fa-solid fa-user nav-btn" onclick="switchTab('profile')" id="navProfile"></i>
  </nav>

  <!-- 1. Authentication Modal (Create Account / Login) -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="authModalTitle">Create WDM Account</span>
      </div>

      <!-- Mode Switch Buttons -->
      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button id="btnTabCreate" class="btn-submit" style="margin: 0; padding: 8px;" onclick="setAuthMode('create')">Register</button>
        <button id="btnTabLogin" class="btn-submit" style="margin: 0; padding: 8px; background: #262626;" onclick="setAuthMode('login')">Login</button>
      </div>

      <!-- Register Form Fields -->
      <div id="registerFields">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="regFullName" class="form-control" placeholder="Enter your name">
        </div>
        <div class="form-group">
  <label>Date of Birth (DD/MM/YY) *</label>
  <input type="text" id="regDOB" class="form-control" placeholder="DDMMYY (eg: 01/01/2001)" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        
        <div class="form-group">
          <label>User ID *</label>
          <input type="text" id="regUsername" class="form-control" placeholder="eg: abc_123,abc-456">
        </div>
      </div>

      <!-- Common Fields -->
      <div class="form-group" id="loginUsernameGroup" style="display: none;">
        <label>User ID *</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="User ID">
      </div>

      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="authPassword" class="form-control" placeholder="eg:abc@123">
      </div>

      <button class="btn-submit" id="authSubmitBtn" onclick="handleAuthSubmit()">Create Account</button>
      
      <div style="text-align: center; margin: 12px 0; color: var(--text-muted); font-size: 0.8rem;">or</div>

      <button class="btn-google" onclick="handleGoogleSignIn()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        login with Google account 
      </button>
    </div>
  </div>

  <!-- 2. Create Post Modal -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>upload new post</span>
        <i class="fa-solid fa-xmark" onclick="closeModal('postModal')" style="cursor: pointer;"></i>
      </div>

      <div class="form-group">
        <label>choose photo/video*</label>
        <input type="file" id="postFileInput" class="form-control" accept="image/*,video/*">
      </div>

      <div class="form-group">
        <label>Description / Caption</label>
        <textarea id="postCaptionInput" class="form-control" rows="3" placeholder="Apne post ke baare mein likhein..."></textarea>
      </div>

      <div class="progress-bar-container" id="postProgressBarBox">
        <div class="progress-bar-fill" id="postProgressBar"></div>
      </div>
      <div id="postUploadStatus" style="font-size: 0.8rem; color: var(--text-muted); text-align: center;"></div>

      <button class="btn-submit" id="btnUploadPost" onclick="uploadPostAction()">share this post</button>
    </div>
  </div>

  <!-- 3. Create Story Modal -->
  <div class="modal-overlay" id="storyModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>create story 
    </span>
        <i class="fa-solid fa-xmark" onclick="closeModal('storyModal')" style="cursor: pointer;"></i>
      </div>

      <div class="form-group">
        <label>Media (Photo / Short Video)</label>
        <input type="file" id="storyFileInput" class="form-control" accept="image/*,video/*">
      </div>

      <div class="progress-bar-container" id="storyProgressBarBox">
        <div class="progress-bar-fill" id="storyProgressBar"></div>
      </div>
      <div id="storyUploadStatus" style="font-size: 0.8rem; color: var(--text-muted); text-align: center;"></div>

      <button class="btn-submit" id="btnUploadStory" onclick="uploadStoryAction()"> Add Story</button>
    </div>
  </div>

  <!-- 4. Edit Profile Modal -->
  <div class="modal-overlay" id="editProfileModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>edit Profile</span>
        <i class="fa-solid fa-xmark" onclick="closeModal('editProfileModal')" style="cursor: pointer;"></i>
      </div>

      <div class="form-group">
        <label>New Profile Picture</label>
        <input type="file" id="editAvatarFileInput" class="form-control" accept="image/*">
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="editFullNameInput" class="form-control">
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea id="editBioInput" class="form-control" rows="3"></textarea>
      </div>

      <div class="progress-bar-container" id="profileProgressBarBox">
        <div class="progress-bar-fill" id="profileProgressBar"></div>
      </div>

      <button class="btn-submit" id="btnSaveProfile" onclick="saveProfileChanges()">Update Karein</button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- 1. CONFIGURATION ---
    const CLOUDINARY_CLOUD_NAME = "afcw94ij";
    const CLOUDINARY_UPLOAD_PRESET = "wdm_media";

    // Aapka existing Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD8ojVhoikbnCRAQ4WrDEkJfdMONeXcuFc",
      authDomain: "wdm-update.firebaseapp.com",
      projectId: "wdm-update",
      storageBucket: "wdm-update.firebasestorage.app",
      messagingSenderId: "677435578526",
      appId: "1:677435578526:web:74119dc8309c4ba744838f",
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserData = null;
    let authMode = "create";

    // --- 2. AUTHENTICATION & SESSION HANDLING ---
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        // Fetch User Data from Firestore
        const userDoc = await db.collection("users").doc(user.uid).get();
        if (userDoc.exists) {
          currentUserData = { uid: user.uid, ...userDoc.data() };
          postAuthInit();
        } else {
          // If Google signin first time
          const tempUsername = "user_" + user.uid.substring(0, 6);
          const initialData = {
            fullName: user.displayName || "Gramin Citizen",
            username: tempUsername,
            dob: "",
            email: user.email || "",
            avatar: user.photoURL || "https://via.placeholder.com/80",
            bio: "Gram Panchayat Wyndhamganj Butbherwa citizen.",
            followers: [],
            following: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection("users").doc(user.uid).set(initialData);
          currentUserData = { uid: user.uid, ...initialData };
          postAuthInit();
        }
      } else {
        // Open Auth Modal
        document.getElementById("authModal").classList.add("active");
      }
    });

    function setAuthMode(mode) {
      authMode = mode;
      const regFields = document.getElementById("registerFields");
      const loginGroup = document.getElementById("loginUsernameGroup");
      const btnTabCreate = document.getElementById("btnTabCreate");
      const btnTabLogin = document.getElementById("btnTabLogin");
      const authTitle = document.getElementById("authModalTitle");
      const submitBtn = document.getElementById("authSubmitBtn");

      if (mode === "create") {
        regFields.style.display = "block";
        loginGroup.style.display = "none";
        btnTabCreate.style.background = "var(--primary-accent)";
        btnTabLogin.style.background = "#262626";
        authTitle.innerText = "Create WDM Account";
        submitBtn.innerText = "Creat account";
      } else {
        regFields.style.display = "none";
        loginGroup.style.display = "block";
        btnTabLogin.style.background = "var(--primary-accent)";
        btnTabCreate.style.background = "#262626";
        authTitle.innerText = "Login to Portal";
        submitBtn.innerText = "Login";
      }
    }

    async function handleAuthSubmit() {
      const password = document.getElementById("authPassword").value;
      if (!password || password.length < 6) {
        alert("at least 6 Digt password must be!");
        return;
      }

      if (authMode === "create") {
        const fullName = document.getElementById("regFullName").value.trim();
        const dob = document.getElementById("regDOB").value.trim();
        const username = document.getElementById("regUsername").value.trim().toLowerCase();

        if (!fullName || !dob || !username) {
          alert("please full fill up!");
          return;
        }

        // Check if username already exists
        const checkUsername = await db.collection("users").where("username", "==", username).get();
        if (!checkUsername.empty) {
          alert("already exists");
          return;
        }

        const email = `${username}@wyndhamganj.local`;

        try {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          const userData = {
            fullName,
            dob,
            username,
            avatar: "https://via.placeholder.com/80",
            bio: "Gram Panchayat Wyndhamganj Butbherwa citizen.",
            followers: [],
            following: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection("users").doc(cred.user.uid).set(userData);
          currentUserData = { uid: cred.user.uid, ...userData };
          closeModal("authModal");
          postAuthInit();
        } catch (err) {
          alert("Registration Error: " + err.message);
        }
      } else {
        // Login mode
        const username = document.getElementById("loginUsername").value.trim().toLowerCase();
        if (!username) {
          alert("User ID darj karein!");
          return;
        }
        const email = `${username}@wyndhamganj.local`;
        try {
          await auth.signInWithEmailAndPassword(email, password);
          closeModal("authModal");
        } catch (err) {
          alert("Invalid User ID ya Password!");
        }
      }
    }

    async function handleGoogleSignIn() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        closeModal("authModal");
      } catch (e) {
        alert("Google Login Error: " + e.message);
      }
    }

    function handleUserLogout() {
      auth.signOut().then(() => {
        location.reload();
      });
    }

    function postAuthInit() {
      document.getElementById("authModal").classList.remove("active");
      if (currentUserData.avatar) {
        document.getElementById("myStoryAvatar").src = currentUserData.avatar;
        document.getElementById("profileUserAvatar").src = currentUserData.avatar;
      }
      document.getElementById("profileFullnameDisplay").innerText = currentUserData.fullName || "";
      document.getElementById("profileUsernameDisplay").innerText = "@" + (currentUserData.username || "");
      document.getElementById("profileBioDisplay").innerText = currentUserData.bio || "";
      
      initFeedListener();
      initStoriesListener();
      initChatListener();
      loadProfilePosts();
    }

    // --- 3. CLOUDINARY UPLOAD HELPER ---
    async function uploadToCloudinary(file, progressCb) {
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url, true);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && progressCb) {
            progressCb(Math.round((e.loaded / e.total) * 100));
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            const res = JSON.parse(xhr.responseText);
            resolve(res.secure_url);
          } else {
            reject("Cloudinary upload failed: " + xhr.statusText);
          }
        };
        xhr.onerror = () => reject("Network error during media upload");
        xhr.send(fd);
      });
    }

     // --- 4. CREATE POST & FEED SYSTEM ---
    async function uploadPostAction() {
      const fileInput = document.getElementById("postFileInput");
      const caption = document.getElementById("postCaptionInput").value;
      const barBox = document.getElementById("postProgressBarBox");
      const bar = document.getElementById("postProgressBar");
      const status = document.getElementById("postUploadStatus");
      const btn = document.getElementById("btnUploadPost");

      if (!fileInput.files[0]) {
        alert("Kripya ek photo ya video select karein!");
        return;
      }

      const file = fileInput.files[0];
      const isVideo = file.type.startsWith("video/");

      try {
        btn.disabled = true;
        barBox.style.display = "block";
        status.innerText = "Cloudinary par upload ho raha hai...";

        const mediaUrl = await uploadToCloudinary(file, (p) => {
          bar.style.width = p + "%";
          status.innerText = `Uploading: ${p}%`;
        });

        status.innerText = "Feed me save ho raha hai...";
        await db.collection("posts").add({
          mediaUrl,
          mediaType: isVideo ? "video" : "image",
          caption,
          userId: currentUserData.uid,
          authorName: currentUserData.fullName,
          authorUsername: currentUserData.username,
          authorAvatar: currentUserData.avatar,
          likes: [],
          views: 1,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        closeModal("postModal");
        fileInput.value = "";
        document.getElementById("postCaptionInput").value = "";
        barBox.style.display = "none";
        status.innerText = "";
      } catch (err) {
        alert("Post failed: " + err);
      } finally {
        btn.disabled = false;
      }
    }

    function initFeedListener() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const postsList = document.getElementById("postsList");
        postsList.innerHTML = "";

        if (snapshot.empty) {
          postsList.innerHTML = '<p style="text-align:center; padding: 40px; color: var(--text-muted);">Abhi koi post nahi hai. Pehla post aap karein!</p>';
          return;
        }

        snapshot.forEach((doc) => {
          const post = doc.data();
          const postId = doc.id;
          const isLiked = post.likes && post.likes.includes(currentUserData.uid);

          const postEl = document.createElement("div");
          postEl.className = "post-card";
          postEl.innerHTML = `
            <div class="post-header">
              <div class="post-user-info">
                <img src="${post.authorAvatar || 'https://via.placeholder.com/36'}" class="post-avatar">
                <span class="post-user-name">${post.authorName || post.authorUsername}</span>
              </div>
            </div>
            <div class="post-media-box">
              ${post.mediaType === "video" 
                ? `<video src="${post.mediaUrl}" controls playsinline></video>` 
                : `<img src="${post.mediaUrl}" loading="lazy">`
              }
            </div>
            <div class="post-actions">
              <div class="post-actions-left">
                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart ${isLiked ? 'liked' : ''}" onclick="toggleLike('${postId}')"></i>
                <i class="fa-regular fa-comment" onclick="openCommentPrompt('${postId}')"></i>
                <i class="fa-regular fa-paper-plane" onclick="sharePostInternal('${postId}')"></i>
              </div>
            </div>
            <div class="post-stats">
              <span>${(post.likes || []).length} likes</span>
              <span>${post.views || 1} views</span>
            </div>
            <div class="post-caption">
              <strong>${post.authorUsername}</strong>${post.caption || ""}
            </div>
          `;
          postsList.appendChild(postEl);
        });
      });
    }

    async function toggleLike(postId) {
      const ref = db.collection("posts").doc(postId);
      const doc = await ref.get();
      if (!doc.exists) return;
      const post = doc.data();
      const likes = post.likes || [];
      const uid = currentUserData.uid;

      if (likes.includes(uid)) {
        await ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(uid) });
      } else {
        await ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(uid) });
        // Send Notification
        if (post.userId !== uid) {
          db.collection("notifications").add({
            toUser: post.userId,
            fromName: currentUserData.fullName,
            text: "ne aapke post ko like kiya.",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
    }

    // --- 5. STORIES SYSTEM ---
    async function uploadStoryAction() {
      const fileInput = document.getElementById("storyFileInput");
      const barBox = document.getElementById("storyProgressBarBox");
      const bar = document.getElementById("storyProgressBar");
      const status = document.getElementById("storyUploadStatus");

      if (!fileInput.files[0]) {
        alert("Photo ya video select karein!");
        return;
      }

      try {
        barBox.style.display = "block";
        const mediaUrl = await uploadToCloudinary(fileInput.files[0], (p) => {
          bar.style.width = p + "%";
          status.innerText = `Uploading: ${p}%`;
        });

        await db.collection("stories").add({
          mediaUrl,
          userId: currentUserData.uid,
          authorName: currentUserData.fullName,
          authorAvatar: currentUserData.avatar,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        closeModal("storyModal");
        fileInput.value = "";
        barBox.style.display = "none";
      } catch (e) {
        alert("Story failed: " + e);
      }
    }

    function initStoriesListener() {
      db.collection("stories").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById("dynamicStories");
        container.innerHTML = "";

        snapshot.forEach((doc) => {
          const s = doc.data();
          const bubble = document.createElement("div");
          bubble.className = "story-bubble";
          bubble.innerHTML = `
            <div class="story-ring" onclick="viewStory('${s.mediaUrl}', '${s.authorName}', '${doc.id}', '${s.userId}')">
              <img src="${s.authorAvatar || 'https://via.placeholder.com/64'}">
            </div>
            <span class="story-username">${s.authorName || 'Citizen'}</span>
          `;
          container.appendChild(bubble);
        });
      });
    }

    function viewStory(url, name, storyId, ownerId) {
      const isOwner = ownerId === currentUserData.uid;
      let opt = prompt(`${name} ki story.\nType 'R' for Reaction (❤️), or 'D' to Delete (agar aapki hai):`);
      if (opt && opt.toUpperCase() === 'D' && isOwner) {
        db.collection("stories").doc(storyId).delete();
        alert("Story delete ho gayi!");
      } else if (opt && opt.toUpperCase() === 'R') {
        alert("Aapne reaction bhej diya: ❤️");
      }
    }

    // --- 6. REAL-TIME CHAT ---
    async function sendDirectMessage() {
      const input = document.getElementById("chatInputText");
      const text = input.value.trim();
      if (!text) return;

      await db.collection("messages").add({
        text,
        senderId: currentUserData.uid,
        senderName: currentUserData.fullName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      input.value = "";
    }

    function initChatListener() {
      db.collection("messages").orderBy("createdAt", "asc").limitToLast(50).onSnapshot((snap) => {
        const box = document.getElementById("chatMessagesBox");
        box.innerHTML = "";
        snap.forEach((doc) => {
          const msg = doc.data();
          const isMine = msg.senderId === currentUserData.uid;
          const msgDiv = document.createElement("div");
          msgDiv.className = `chat-msg ${isMine ? 'mine' : 'theirs'}`;
          msgDiv.innerText = `${isMine ? '' : msg.senderName + ': '}${msg.text}`;
          box.appendChild(msgDiv);
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    // --- 7. EDIT PROFILE & CLOUDINARY ---
    async function saveProfileChanges() {
      const name = document.getElementById("editFullNameInput").value.trim();
      const bio = document.getElementById("editBioInput").value.trim();
      const fileInput = document.getElementById("editAvatarFileInput");
      const barBox = document.getElementById("profileProgressBarBox");
      const bar = document.getElementById("profileProgressBar");

      let updatedData = { fullName: name, bio: bio };

      try {
        if (fileInput.files[0]) {
          barBox.style.display = "block";
          const avatarUrl = await uploadToCloudinary(fileInput.files[0], (p) => {
            bar.style.width = p + "%";
          });
          updatedData.avatar = avatarUrl;
        }

        await db.collection("users").doc(currentUserData.uid).update(updatedData);
        currentUserData = { ...currentUserData, ...updatedData };
        postAuthInit();
        closeModal("editProfileModal");
      } catch (err) {
        alert("Update failed: " + err);
      }
    }

    async function loadProfilePosts() {
      const grid = document.getElementById("profilePostsGrid");
      const countEl = document.getElementById("profilePostsCount");
      const snap = await db.collection("posts").where("userId", "==", currentUserData.uid).get();

      grid.innerHTML = "";
      countEl.innerText = snap.size;

      snap.forEach((doc) => {
        const p = doc.data();
        const item = document.createElement("div");
        item.className = "profile-grid-item";
        item.innerHTML = p.mediaType === "video" 
          ? `<video src="${p.mediaUrl}"></video>` 
          : `<img src="${p.mediaUrl}">`;
        grid.appendChild(item);
      });
    }

    // --- 8. SEARCH & TABS ROUTER ---
    function switchTab(tab) {
      document.getElementById("feedView").style.display = tab === 'feed' ? 'block' : 'none';
      document.getElementById("searchView").style.display = tab === 'search' ? 'block' : 'none';
      document.getElementById("chatView").style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById("profileView").style.display = tab === 'profile' ? 'block' : 'none';
      document.getElementById("notifView").style.display = tab === 'notifications' ? 'block' : 'none';

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      if (tab === 'feed') document.getElementById("navHome").classList.add("active");
      if (tab === 'search') document.getElementById("navSearch").classList.add("active");
      if (tab === 'profile') document.getElementById("navProfile").classList.add("active");
    }

    async function handleSearch(q) {
      q = q.trim().toLowerCase();
      const resBox = document.getElementById("searchResults");
      if (!q) { resBox.innerHTML = ""; return; }

      const snap = await db.collection("posts").get();
      resBox.innerHTML = "";
      snap.forEach(doc => {
        const p = doc.data();
        if ((p.caption && p.caption.toLowerCase().includes(q)) || (p.authorUsername && p.authorUsername.toLowerCase().includes(q))) {
          const row = document.createElement("div");
          row.style.padding = "8px 0";
          row.style.borderBottom = "1px solid #202020";
          row.innerHTML = `<strong>@${p.authorUsername}</strong>: ${p.caption || 'Media'}`;
          resBox.appendChild(row);
        }
      });
    }

    function openCreatePostModal() { document.getElementById("postModal").classList.add("active"); }
    function openStoryUploadModal() { document.getElementById("storyModal").classList.add("active"); }
    function openEditProfileModal() { 
      document.getElementById("editFullNameInput").value = currentUserData.fullName || "";
      document.getElementById("editBioInput").value = currentUserData.bio || "";
      document.getElementById("editProfileModal").classList.add("active"); 
    }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }
    function sharePostInternal(postId) { alert("Post link copy ho gaya hai!"); }
    function openCommentPrompt(postId) {
      const c = prompt("Comment likhein:");
      if (c) alert("Comment add ho gaya!");
    }
  </script>
