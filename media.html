<style>
:root {
  --bg: #000000;
  --panel: #121212;
  --panel-elevated: #1a1a1a;
  --line: #262626;
  --txt: #f5f5f5;
  --muted: #8e8e8e;
  --accent: #0095f6;
  --like: #ff3040;
  --green: #31a24c;
  --story-grad: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--txt); min-height: 100vh; padding-bottom: 56px; overflow-x: hidden; }

/* Loading VFX */
#appLoadingVFX {
  position: fixed; inset: 0; background: #050505; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
.vfx-ring {
  width: 68px; height: 68px; border-radius: 50%;
  border: 4px solid transparent;
  border-top-color: #ff477e; border-right-color: #8c62ff; border-bottom-color: #f09433;
  animation: vfxSpin 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
  box-shadow: 0 0 30px rgba(230, 104, 60, 0.4);
}
@keyframes vfxSpin { 100% { transform: rotate(360deg); } }
.vfx-logo { font-size: 24px; font-weight: 800; background: var(--story-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* Header */
header.app-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(0,0,0,0.94); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  height: 52px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
}
.brand { font-size: 22px; font-weight: 800; background: var(--story-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
.head-actions { display: flex; align-items: center; gap: 18px; font-size: 1.25rem; }
.head-actions i { cursor: pointer; }

.main-wrap { max-width: 600px; margin: 0 auto; }

/* Stories Tray */
.stories-tray {
  display: flex; gap: 14px; padding: 12px 14px;
  overflow-x: auto; border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}
.stories-tray::-webkit-scrollbar { display: none; }
.story-circle { display: flex; flex-direction: column; align-items: center; width: 66px; flex-shrink: 0; cursor: pointer; }
.story-ring {
  width: 62px; height: 62px; border-radius: 50%; padding: 2.5px;
  background: var(--story-grad); display: flex; align-items: center; justify-content: center; position: relative;
}
.story-ring.add-ring { background: #333; }
.story-ring.close-friends-ring { background: var(--green); }
.story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg); }
.add-badge {
  position: absolute; bottom: 0; right: 0; width: 18px; height: 18px;
  background: var(--accent); color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid var(--bg);
}
.story-username { font-size: 0.72rem; color: var(--muted); margin-top: 4px; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Posts Feed */
.post-item { border-bottom: 1px solid var(--line); margin-bottom: 8px; position: relative; }
.post-meta { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
.post-author { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.post-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #262626; }
.post-author-name { font-weight: 600; font-size: 0.88rem; }
.post-media-container { width: 100%; position: relative; background: #080808; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.post-media { width: 100%; max-height: 540px; object-fit: contain; }
.heart-burst {
  position: absolute; font-size: 5rem; color: #fff; opacity: 0; pointer-events: none;
  transform: scale(0.5); transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s;
  text-shadow: 0 4px 20px rgba(255, 48, 64, 0.6);
}
.heart-burst.active { opacity: 0.95; transform: scale(1.3); }

.post-actions { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; font-size: 1.35rem; }
.post-actions-left { display: flex; gap: 16px; }
.post-actions i { cursor: pointer; }
.post-actions i.liked { color: var(--like); }
.post-stats { padding: 0 14px; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
.post-caption { padding: 0 14px; font-size: 0.88rem; line-height: 1.4; word-break: break-word; }
.post-caption strong { margin-right: 6px; cursor: pointer; }
.post-time-meta { font-size: 0.72rem; color: var(--muted); padding: 4px 14px 10px; text-transform: uppercase; }

/* Bottom Nav */
nav.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 52px;
  background: var(--bg); border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-around;
  z-index: 50; font-size: 1.25rem;
}
.nav-btn { color: var(--muted); cursor: pointer; }
.nav-btn.active { color: var(--txt); }
.nav-avatar-btn { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; border: 1.5px solid transparent; cursor: pointer; }
.nav-avatar-btn.active { border-color: var(--txt); }

/* Direct Messages & Chat */
.dm-screen-wrap { display: flex; flex-direction: column; height: calc(100vh - 110px); }
.dm-inbox-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-weight: 700; }
.dm-chat-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #161616; }
.dm-chat-left { display: flex; align-items: center; gap: 12px; }
.dm-chat-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
.dm-badge-new { font-size: 0.65rem; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 10px; font-weight: 700; }

.dm-active-window { display: flex; flex-direction: column; height: 100%; flex: 1; }
.dm-list { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.dm-bubble-row { display: flex; flex-direction: column; width: 100%; }
.dm-bubble { max-width: 75%; padding: 9px 13px; border-radius: 18px; font-size: 0.88rem; word-break: break-word; }
.dm-bubble.mine { background: var(--accent); color: #fff; align-self: flex-end; }
.dm-bubble.theirs { background: var(--panel); border: 1px solid var(--line); color: var(--txt); align-self: flex-start; }
.dm-bubble img { max-width: 100%; border-radius: 12px; display: block; margin-top: 4px; cursor: pointer; }
.dm-msg-info { font-size: 0.68rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.dm-msg-info.mine { align-self: flex-end; }
.dm-msg-info.theirs { align-self: flex-start; }
.dm-seen-status { color: #5bc0be; font-weight: 600; font-size: 0.68rem; }

.dm-request-banner { background: #1c1822; border-bottom: 1px solid #332042; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.dm-input-bottom { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg); }
.btn-plus-photo {
  width: 34px; height: 34px; border-radius: 50%; background: #262626; color: var(--txt);
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
}

/* Profile View */
.profile-view { padding: 14px; }
.profile-vibe-bubble {
  position: absolute; top: -14px; left: -6px; background: #262626; color: #fff;
  font-size: 0.68rem; padding: 3px 8px; border-radius: 12px; border: 1px solid #3a3a3a; white-space: nowrap;
}
.profile-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.profile-stats-box { display: flex; gap: 24px; text-align: center; margin-right: 12px; }
.profile-stat-btn { background: transparent; border: none; color: var(--txt); cursor: pointer; text-align: center; }
.profile-num { font-weight: 700; font-size: 1.05rem; }
.profile-lbl { font-size: 0.75rem; color: var(--muted); }
.profile-dashboard-card {
  background: #181818; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  margin: 10px 0 14px; display: flex; flex-direction: column; gap: 3px; cursor: pointer;
}
.profile-actions-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.profile-actions-bar button {
  flex: 1; padding: 8px; background: var(--panel); border: 1px solid var(--line);
  color: var(--txt); border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
}
.profile-tabs-bar { display: flex; border-top: 1px solid var(--line); margin-bottom: 2px; }
.profile-tab-btn { flex: 1; text-align: center; padding: 10px 0; font-size: 1.1rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.profile-tab-btn.active { color: var(--txt); border-color: var(--txt); }
.profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.grid-cell { aspect-ratio: 1; background: #161616; overflow: hidden; cursor: pointer; position: relative; }
.grid-cell img { width: 100%; height: 100%; object-fit: cover; }
.grid-cell-meta-pill { position: absolute; bottom: 6px; left: 6px; color: #fff; font-size: 0.7rem; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 4px; }

/* New Post Studio */
.new-post-studio-screen { position: fixed; inset: 0; background: #000; z-index: 160; display: none; flex-direction: column; }
.new-post-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #1a1a1a; }
.new-post-tools-rail {
  position: absolute; right: 14px; top: 70px; display: flex; flex-direction: column; gap: 14px;
  background: rgba(0,0,0,0.55); padding: 12px 8px; border-radius: 24px; backdrop-filter: blur(8px); z-index: 10;
.dm-active-window { display: flex; flex-direction: column; height: calc(100vh - 104px); flex: 1; position: relative; }
.dm-list { flex: 1; overflow-y: auto; padding: 14px 14px 72px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.dm-bubble-row { display: flex; flex-direction: column; width: 100%; }
.dm-bubble-wrap { display: flex; align-items: flex-end; gap: 6px; max-width: 82%; }
.dm-bubble-wrap.mine { align-self: flex-end; flex-direction: row-reverse; }
.dm-bubble-wrap.theirs { align-self: flex-start; }
.dm-bubble { padding: 9px 13px; border-radius: 18px; font-size: 0.88rem; word-break: break-word; line-height: 1.35; }
.dm-bubble.mine { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.dm-bubble.theirs { background: var(--panel); border: 1px solid var(--line); color: var(--txt); border-bottom-left-radius: 4px; }
.dm-bubble img { max-width: 220px; max-height: 260px; border-radius: 12px; display: block; cursor: pointer; object-fit: cover; }
.dm-side-time { font-size: 0.64rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; margin-bottom: 2px; }
.dm-msg-info { font-size: 0.66rem; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
.dm-msg-info.mine { align-self: flex-end; padding-right: 4px; }
.dm-seen-status { color: #5bc0be; font-weight: 700; font-size: 0.68rem; }

.dm-request-banner { background: #1c1822; border-bottom: 1px solid #332042; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.dm-input-bottom {
  position: sticky; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-top: 1px solid var(--line); background: rgba(0, 0, 0, 0.96); backdrop-filter: blur(12px);
}
.dm-input-bottom .field-input { border-radius: 22px; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; }
.btn-plus-photo {
  width: 38px; height: 38px; border-radius: 50%; background: #262626; color: var(--txt);
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
  border: 1px solid #383838; transition: transform 0.15s;
}
.btn-plus-photo:active { transform: scale(0.92); }
.presence-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.presence-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
.presence-dot.offline { background: #666; }

.share-action-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 64px; cursor: pointer; }

/* High-VFX Floating Hearts in Story Viewer */
.vfx-float-heart {
  position: absolute; bottom: 75px; right: 48px; font-size: 1.8rem; pointer-events: none; z-index: 220;
  animation: floatHeartUp 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  filter: drop-shadow(0 4px 12px rgba(255, 48, 64, 0.7));
}
@keyframes floatHeartUp {
  0% { transform: translateY(0) scale(0.5) rotate(-10deg); opacity: 0; }
  20% { opacity: 1; transform: translateY(-30px) scale(1.2) rotate(8deg); }
  100% { transform: translateY(-260px) scale(0.9) rotate(-15deg); opacity: 0; }
}

/* Circular Avatar Zoom Lightbox (Instagram Style) */
#avatarZoomModal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(18px);
  z-index: 280; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
#avatarZoomModal.show { display: flex; animation: fadeInZoom 0.22s ease-out; }
@keyframes fadeInZoom { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
.avatar-zoom-circle {
  width: 270px; height: 270px; border-radius: 50%; padding: 4px; background: var(--story-grad);
  box-shadow: 0 12px 45px rgba(0,0,0,0.85);
}
.avatar-zoom-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #000; }

}
.settings-row-left { display: flex; align-items: center; gap: 12px; }
.settings-row-left i { width: 20px; text-align: center; font-size: 1.05rem; }

    // --- NAVIGATION HISTORY CONTROLLER ---
    let navHistory = ['feed'];
    let exitPressCounter = 0;

    function pushNavState(tab) {
      if (navHistory[navHistory.length - 1] !== tab) {
        navHistory.push(tab);
        history.pushState({ section: tab }, "", "#" + tab);
      }
    }

    window.addEventListener("popstate", (e) => {
      if (document.getElementById("avatarZoomModal").classList.contains("show")) {
        closeAvatarZoom();
        return;
      }
      if (document.getElementById("otherUserProfileModal").classList.contains("show")) {
        closeOtherUserProfile();
        return;
      }
      if (document.getElementById("newPostStudioScreen").style.display === "flex") {
        closeNewPostStudio();
        return;
      }
      if (document.getElementById("postDetailScreen").style.display === "flex") {
        closePostDetailScreen();
        return;
      }
      if (document.getElementById("shareBottomSheet").style.display === "flex") {
        closeShareSheet();
        return;
      }
      if (document.getElementById("storyViewerScreen").style.display === "flex") {
        closeStoryViewer();
        return;
      }
      if (document.getElementById("activeChatWindow").offsetParent !== null) {
        closeActiveChat();
        return;
      }

      if (navHistory.length > 1) {
        navHistory.pop();
        const prevSection = navHistory[navHistory.length - 1];
        renderNavSection(prevSection);
      } else {
        exitPressCounter++;
        if (exitPressCounter === 1) {
          showToast("Press back again to exit to Wyndhamganj portal.");
          setTimeout(() => { exitPressCounter = 0; }, 2500);
          history.pushState({ section: 'feed' }, "", "#feed");
        } else if (exitPressCounter >= 2) {
          window.location.href = "index.html";
        }
      }
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2800);
    }

        if (doc.exists) {
          me = { uid: user.uid, ...doc.data() };
          launchApp();
        } else {
          const defaultUsername = "user_" + user.uid.slice(0, 5);
          const userData = {
            uid: user.uid,

    async function submitAuth() {
      const pass = document.getElementById("authPassword").value.trim();
      if (!pass || pass.length < 6) return showToast("Password must be at least 6 characters.");

      if (authMode === "register") {
        const fullName = document.getElementById("regFullName").value.trim();
        const username = document.getElementById("regUsername").value.trim().toLowerCase();
        const email = document.getElementById("regEmail").value.trim();
        if (!fullName || !username || !email) return showToast("All fields required.");

        try {
          const cred = await auth.createUserWithEmailAndPassword(email, pass);
          const userData = {
            uid: cred.user.uid,
            fullName, username, email,
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120",
            bio: "WDM Community Member",
            followers: [], following: [],
            createdAt: FV.serverTimestamp()
          };
          await db.collection("users").doc(cred.user.uid).set(userData, { merge: true });
          me = userData;
          closeModal("authGatewayModal");
          launchApp();
        } catch (e) { showToast(e.message); }
      } else {
        const id = document.getElementById("loginIdentifier").value.trim().toLowerCase();

          const q = await db.collection("users").where("username", "==", id).limit(1).get();
          if (q.empty) return showToast("User ID not found!");
          targetEmail = q.docs[0].data().email;

          closeModal("authGatewayModal");
        } catch (e) { showToast("Invalid credentials."); }

    // --- REAL-TIME ONLINE / OFFLINE PRESENCE TRACKER ---
    function startPresenceHeartbeat() {
      if (!me || !me.uid) return;
      const userRef = db.collection("users").doc(me.uid);
      const setStatus = (online) => {
        userRef.set({
          isOnline: online,
          lastSeen: FV.serverTimestamp()
        }, { merge: true }).catch(() => {});
      };
      setStatus(true);
      setInterval(() => {
        if (document.visibilityState === "visible" && me) setStatus(true);
      }, 45000);
      document.addEventListener("visibilitychange", () => {
        if (me) setStatus(document.visibilityState === "visible");
      });
      window.addEventListener("beforeunload", () => {
        if (me) setStatus(false);
      });
    }

    function isUserActuallyOnline(u) {
      if (!u || !u.isOnline) return false;
      if (!u.lastSeen) return true;
      const lastMs = u.lastSeen.toMillis ? u.lastSeen.toMillis() : new Date(u.lastSeen).getTime();
      return (Date.now() - lastMs) < 120000; // 2-minute active threshold
    }

    // --- CLOUDINARY UPLOADER ---
    async function uploadImageToCloudinary(file) {
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch(url, { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "Upload failed");
      return data.secure_url;
    }

    async function togglePostLike(pid) {
      const ref = db.collection("posts").doc(pid);
      const icon = document.getElementById(`like-icon-${pid}`);
      const countEl = document.getElementById(`like-count-${pid}`);

      await db.runTransaction(async t => {
        const doc = await t.get(ref);
        if (!doc.exists) return;
        const likes = doc.data().likes || [];
        const currentlyLiked = likes.includes(me.uid);

        if (currentlyLiked) {
          t.update(ref, { likes: FV.arrayRemove(me.uid) });
          if (icon) { icon.className = "fa-regular fa-heart"; icon.classList.remove("liked"); }
          if (countEl) countEl.innerText = `${Math.max(0, likes.length - 1)} likes`;
        } else {
          t.update(ref, { likes: FV.arrayUnion(me.uid) });
          if (icon) { icon.className = "fa-solid fa-heart liked"; }
          if (countEl) countEl.innerText = `${likes.length + 1} likes`;
        }
      });
    }

    function triggerHeartBurstLike(pid) {
      const burst = document.getElementById(`burst-${pid}`);
      if (burst) {
        burst.classList.add("active");
        setTimeout(() => burst.classList.remove("active"), 650);

    }

    // --- 6. DIRECT MESSAGING, REAL-TIME PRESENCE & PHOTO SHARING (FIXED) ---
    function listenDMInbox() {
      db.collection("chats").where("members", "array-contains", me.uid).onSnapshot(async snap => {
        const container = document.getElementById("dmChatListContainer");
        const chatDocs = [];
        snap.forEach(d => chatDocs.push({ id: d.id, ...d.data() }));

        chatDocs.sort((a, b) => {
          const tA = a.updatedAt?.toMillis ? a.updatedAt.toMillis() : 0;
          const tB = b.updatedAt?.toMillis ? b.updatedAt.toMillis() : 0;
          return tB - tA;
        });

        if (chatDocs.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--muted); font-size:0.85rem;">No active chats yet.</div>';
          return;
        }

        container.innerHTML = "";
        const myFollowingSet = new Set(me.following || []);
        const blockedSet = new Set(me.blockedUsers || []);

        for (const chat of chatDocs) {
          const otherUid = (chat.members || []).find(id => id !== me.uid);
          if (!otherUid || blockedSet.has(otherUid)) continue;

          let otherUser = { username: "User", fullName: "Member", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=50" };
          try {
            const uDoc = await db.collection("users").doc(otherUid).get();
            if (uDoc.exists) otherUser = uDoc.data();
          } catch(e){}

          const onlineNow = isUserActuallyOnline(otherUser);
          const isPendingReq = chat.lastSenderId === otherUid && !myFollowingSet.has(otherUid) && !chat.isAccepted;

          const item = document.createElement("div");
          item.className = "dm-chat-item";
          item.innerHTML = `
            <div class="dm-chat-left">
              <div style="position:relative;" onclick="event.stopPropagation(); openUserProfile('${otherUid}');">
                <img src="${otherUser.avatar}" class="dm-chat-avatar">
                <span class="presence-dot ${onlineNow ? 'online' : 'offline'}" style="position:absolute; bottom:2px; right:2px; border:2px solid #000; width:11px; height:11px;"></span>
              </div>
              <div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-weight:700; font-size:0.92rem;">${otherUser.fullName || otherUser.username}</span>
                  ${isPendingReq ? '<span class="dm-badge-new">NEW REQUEST</span>' : ''}
                </div>
                <div style="font-size:0.75rem; color:var(--muted); margin-top:2px;">${chat.lastMessage || 'Active conversation'}</div>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:var(--muted); font-size:0.8rem;"></i>
          `;
          item.onclick = () => openDirectChat(otherUid, otherUser.username, otherUser.avatar, isPendingReq);
          container.appendChild(item);
        }
      });
    }

    function openDirectChat(targetUid, targetUsername, targetAvatar, isPendingReq) {
      activeChatTargetUid = targetUid;
      activeChatPairId = [me.uid, targetUid].sort().join("_");

      document.getElementById("inboxMainView").style.display = "none";
      document.getElementById("activeChatWindow").classList.remove("hidden");
      document.getElementById("chatHeaderAvatar").src = targetAvatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=50";
      document.getElementById("chatActiveUserLabel").innerText = "@" + targetUsername;
      document.getElementById("chatRequestBanner").classList.toggle("hidden", !isPendingReq);

      // Live Online / Offline Presence Listener for Chat Header
      if (chatPresenceUnsub) chatPresenceUnsub();
      chatPresenceUnsub = db.collection("users").doc(targetUid).onSnapshot(uSnap => {
        if (!uSnap.exists) return;
        const uData = uSnap.data();
        const isOnline = isUserActuallyOnline(uData);
        const dot = document.getElementById("chatPresenceDot");
        const lbl = document.getElementById("chatPresenceStatusLabel");
        if (isOnline) {
          dot.className = "presence-dot online";
          lbl.innerText = "Active now";
          lbl.style.color = "var(--green)";
        } else {
          dot.className = "presence-dot offline";
          lbl.innerText = uData.lastSeen ? "Offline · " + formatTimeAgo(uData.lastSeen.toDate()) + " ago" : "Offline";
          lbl.style.color = "var(--muted)";
        }
      });

      db.collection("chats").doc(activeChatPairId).set({
        members: [me.uid, targetUid],
        updatedAt: FV.serverTimestamp()
      }, { merge: true });

      if (chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = db.collection("chats").doc(activeChatPairId).collection("messages").orderBy("createdAt", "asc").limit(120).onSnapshot(snap => {
        const box = document.getElementById("dmMessageList");
        box.innerHTML = "";
        snap.forEach(d => {
          const m = d.data();
          const isMine = m.senderId === me.uid;

          // Real-time Seen Receipt: mark incoming messages as seen when receiver opens chat
          if (!isMine && m.seen === false) {
            d.ref.update({ seen: true }).catch(() => {});
          }

          const time = m.createdAt ? new Date(m.createdAt.toDate ? m.createdAt.toDate() : m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Now';

          const row = document.createElement("div");
          row.className = "dm-bubble-row";

          const wrap = document.createElement("div");
          wrap.className = `dm-bubble-wrap ${isMine ? 'mine' : 'theirs'}`;

          const bubble = document.createElement("div");
          bubble.className = `dm-bubble ${isMine ? 'mine' : 'theirs'}`;

          if (m.mediaUrl) {
            bubble.innerHTML = `<img src="${m.mediaUrl}" alt="Shared photo" onclick="window.open('${m.mediaUrl}', '_blank')">`;
          } else {
            bubble.innerText = m.text;
          }

          const sideTime = document.createElement("span");
          sideTime.className = "dm-side-time";
          sideTime.innerText = time;

          wrap.appendChild(bubble);
          wrap.appendChild(sideTime);
          row.appendChild(wrap);

          if (isMine) {
            const info = document.createElement("div");
            info.className = "dm-msg-info mine";
            info.innerHTML = m.seen ? '<span class="dm-seen-status">Seen</span>' : '<span>Sent</span>';
            row.appendChild(info);
          }

          box.appendChild(row);
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function closeActiveChat() {
      if (chatUnsubscribe) chatUnsubscribe();
      if (chatPresenceUnsub) chatPresenceUnsub();
      document.getElementById("activeChatWindow").classList.add("hidden");
      document.getElementById("inboxMainView").style.display = "flex";
      activeChatPairId = null;
    }

    async function sendDirectMessage() {
      const inp = document.getElementById("dmInputMessage");
      const text = inp.value.trim();
      if (!text || !activeChatPairId) return;

      inp.value = "";

      await db.collection("chats").doc(activeChatPairId).set({
        members: [me.uid, activeChatTargetUid],
        lastMessage: text,
        lastSenderId: me.uid,
        updatedAt: FV.serverTimestamp()
      }, { merge: true });

      await db.collection("chats").doc(activeChatPairId).collection("messages").add({
        senderId: me.uid,
        text: text,
        seen: false,
        createdAt: FV.serverTimestamp()
      });
    }

    function triggerChatPhotoPick() {
      if (!activeChatPairId) return showToast("Open a chat first.");
      const inp = document.getElementById("chatPhotoInputHidden");
      inp.value = "";
      inp.click();
    }

    async function onChatPhotoPicked(input) {
      if (!input.files || !input.files[0]) return;
      if (!activeChatPairId || !activeChatTargetUid) return showToast("No active conversation.");

      const file = input.files[0];
      try {
        showToast("Uploading & sending photo...");
        const url = await uploadImageToCloudinary(file);

        await db.collection("chats").doc(activeChatPairId).set({
          members: [me.uid, activeChatTargetUid],
          lastMessage: "📷 Photo",
          lastSenderId: me.uid,
          updatedAt: FV.serverTimestamp()
        }, { merge: true });

        await db.collection("chats").doc(activeChatPairId).collection("messages").add({
          senderId: me.uid,
          mediaUrl: url,
          seen: false,
          createdAt: FV.serverTimestamp()
        });
        showToast("Photo sent!");
      } catch (e) {
        showToast("Photo upload failed: " + e.message);
      } finally {
        input.value = "";
      }
    }
    function sendStoryReaction(emoji) {
      triggerStoryHeartVFX();
      showToast("Reaction sent: " + emoji);
    }

    function triggerStoryHeartVFX() {
      const body = document.getElementById("storyViewerBody");
      if (!body) return;
      for (let i = 0; i < 6; i++) {
        const h = document.createElement("div");
        h.className = "vfx-float-heart";
        h.innerText = i % 2 === 0 ? "❤️" : "🔥";
        h.style.right = (28 + Math.random() * 55) + "px";
        h.style.animationDuration = (1.0 + Math.random() * 0.6) + "s";
        body.appendChild(h);
        setTimeout(() => h.remove(), 1600);
      }
    }

    async function sendStoryReply(txt) {
      const reply = txt.trim();
      if (!reply || !activeStoryData) return;
      document.getElementById("storyReplyInput").value = "";
      triggerStoryHeartVFX();
      if (activeStoryData.uid && activeStoryData.uid !== me.uid) {
        const pairId = [me.uid, activeStoryData.uid].sort().join("_");
        await db.collection("chats").doc(pairId).set({
          members: [me.uid, activeStoryData.uid],
          lastMessage: `Replied to story: ${reply}`,
          lastSenderId: me.uid,
          updatedAt: FV.serverTimestamp()
        }, { merge: true });
        await db.collection("chats").doc(pairId).collection("messages").add({
          senderId: me.uid,
          text: `Story reply: "${reply}"`,
          seen: false,
          createdAt: FV.serverTimestamp()
        });
      }
      showToast("Reply sent to @" + activeStoryData.authorUsername);
    }

    function shareCurrentStory() {
      if (!activeStoryData) return;
      activeSharePostId = "story_" + activeStoryData.id;
      document.getElementById("shareBottomSheet").style.display = "flex";
      openShareSheet(activeSharePostId);
    }

    async function blockUserFromChat() {
      if (!activeChatTargetUid) return;
      await db.collection("users").doc(me.uid).update({ blockedUsers: FV.arrayUnion(activeChatTargetUid) });
      closeActiveChat();
      showToast("User blocked.");
    }

    // --- 7. STORY STUDIO & 24H EXPIRATION ---
    function triggerStoryPicker() { document.getElementById("storyImageInputHidden").click(); }
    function onStoryImageSelected(input) {
      if (input.files && input.files[0]) {
        document.getElementById("storyEditorImg").src = URL.createObjectURL(input.files[0]);
        document.getElementById("storyEditorScreen").style.display = "flex";
      }
    }

    function closeStoryEditor() { document.getElementById("storyEditorScreen").style.display = "none"; }
    function toggleCloseFriendsStory() {
      isCloseFriendsStory = !isCloseFriendsStory;
      const b = document.getElementById("storyAudienceBadge");
      b.innerText = isCloseFriendsStory ? "Close Friends" : "Everyone";
      b.style.color = isCloseFriendsStory ? "var(--green)" : "#fff";
    }

    async function publishStoryStudio() {
      const input = document.getElementById("storyImageInputHidden");
      if (!input.files || !input.files[0]) return;
      try {
        showToast("Publishing story...");
        const url = await uploadImageToCloudinary(input.files[0]);

        await db.collection("stories").add({
          uid: me.uid,
          authorUsername: me.username,
          avatar: me.avatar,
          mediaUrl: url,
          isCloseFriends: isCloseFriendsStory,
          viewers: [],
          expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 86400000)),
          createdAt: FV.serverTimestamp()
        });

        closeStoryEditor();
        showToast("Story shared for 24 hours!");
      } catch (e) { showToast(e.message); }
    }

    function listenStories() {
      const now = firebase.firestore.Timestamp.now();
      db.collection("stories").where("expiresAt", ">", now).orderBy("expiresAt", "desc").onSnapshot(snap => {
        const tray = document.getElementById("dynamicStoriesList");
        tray.innerHTML = "";
        snap.forEach(doc => {
          const s = doc.data();
          const sid = doc.id;
          const bubble = document.createElement("div");
          bubble.className = "story-circle";
          bubble.innerHTML = `
            <div class="story-ring ${s.isCloseFriends ? 'close-friends-ring' : ''}" onclick='openStoryViewer(${JSON.stringify(s)}, "${sid}")'>
              <img src="${s.avatar}">
            </div>
            <span class="story-username">@${s.authorUsername}</span>
          `;
          tray.appendChild(bubble);
        });
      });
    }

    function openStoryViewer(data, storyId) {
      activeStoryData = { id: storyId, ...data };
      document.getElementById("activeStoryViewerImg").src = data.mediaUrl;
      document.getElementById("activeStoryViewerAvatar").src = data.avatar;
      document.getElementById("activeStoryViewerName").innerText = "@" + data.authorUsername;
      document.getElementById("activeStoryTimeAgo").innerText = formatTimeAgo(data.createdAt?.toDate?.());
      document.getElementById("storyViewerScreen").style.display = "flex";

      if (data.uid !== me.uid) {
        db.collection("stories").doc(storyId).update({
          viewers: FV.arrayUnion({ uid: me.uid, username: me.username, avatar: me.avatar, seenAt: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) })
        }).catch(()=>{});
      }

      const bar = document.getElementById("storyProgressAnim");
      bar.style.width = "0%";
      let progress = 0;
      clearInterval(storyProgressInterval);
      storyProgressInterval = setInterval(() => {
        progress += 2;
        bar.style.width = progress + "%";
        if (progress >= 100) { clearInterval(storyProgressInterval); closeStoryViewer(); }
      }, 100);
    }

    function closeStoryViewer() {
      clearInterval(storyProgressInterval);
      document.getElementById("storyViewerScreen").style.display = "none";
      activeStoryData = null;
    }

    function sendStoryReaction(emoji) { showToast("Reaction sent: " + emoji); }
    function sendStoryReply(txt) { if (txt.trim()) showToast("Replied: " + txt); }

    function openStoryActivityDrawer() {
      if (!activeStoryData) return;
      const viewers = activeStoryData.viewers || [];
      document.getElementById("activityViewerCount").innerText = `${viewers.length} views`;
      document.getElementById("storyDeleteActionBtn").style.display = activeStoryData.uid === me.uid ? "block" : "none";

      const list = document.getElementById("activityViewersList");
      list.innerHTML = "";
      if (viewers.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted); font-size:0.85rem;">No viewers yet.</div>`;
      } else {
        viewers.forEach(v => {
          const row = document.createElement("div");
          row.style.cssText = "display:flex; align-items:center; justify-content:space-between; padding:6px 0;";
          row.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${u.avatar}" style="width:38px; height:38px; border-radius:50%; object-fit:cover;">
            <div>
              <div style="font-weight:700; font-size:0.9rem;">@${u.username}</div>
              <div style="font-size:0.75rem; color:var(--muted);">${u.fullName}</div>
            </div>
          </div>
          <button class="btn-solid" style="width:auto; padding:5px 12px; font-size:0.75rem;" onclick="closeModal('userFollowListModal'); openUserProfile('${uid}');">View</button>
        `;
        container.appendChild(row);
      }
    }

    // --- OTHER USER FULLSCREEN PROFILE & CIRCULAR AVATAR ZOOM ---
    async function openUserProfile(targetUid) {
      if (!targetUid) return;
      if (targetUid === me.uid) {
        switchNav('profile');
        return;
      }
      viewingOtherUid = targetUid;
      const doc = await db.collection("users").doc(targetUid).get();
      if (!doc.exists) return showToast("User profile not found.");
      const u = doc.data();

      document.getElementById("otherProfileHeaderTitle").innerText = "@" + u.username;
      document.getElementById("otherProfileAvatar").src = u.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120";
      document.getElementById("otherProfileFullname").innerText = u.fullName || u.username;
      document.getElementById("otherProfileBio").innerText = u.bio || "";
      document.getElementById("otherStatFollowers").innerText = (u.followers || []).length;
      document.getElementById("otherStatFollowing").innerText = (u.following || []).length;

      const onlineNow = isUserActuallyOnline(u);
      const badge = document.getElementById("otherProfilePresenceBadge");
      badge.innerHTML = onlineNow
        ? `<span class="presence-dot online"></span> <span style="color:var(--green);">Active now</span>`
        : `<span class="presence-dot offline"></span> Offline`;

      const isFollowing = (me.following || []).includes(targetUid);
      const fBtn = document.getElementById("otherFollowToggleBtn");
      fBtn.innerText = isFollowing ? "Following" : "Follow";
      fBtn.style.background = isFollowing ? "#262626" : "var(--accent)";

      const postsSnap = await db.collection("posts").where("authorId", "==", targetUid).get();
      document.getElementById("otherStatPosts").innerText = postsSnap.size;
      const grid = document.getElementById("otherProfileGridList");
      grid.innerHTML = "";
      postsSnap.forEach(pd => {
        const p = pd.data();
        const cell = document.createElement("div");
        cell.className = "grid-cell";
        cell.innerHTML = `<img src="${p.mediaUrl}">`;
        cell.onclick = () => { closeOtherUserProfile(); openPostDetailScreen(pd.id); };
        grid.appendChild(cell);
      });

      document.getElementById("otherUserProfileModal").classList.add("show");
      history.pushState({ modal: "otherProfile" }, "", "#user-" + u.username);
    }

    function closeOtherUserProfile() {
      document.getElementById("otherUserProfileModal").classList.remove("show");
      viewingOtherUid = null;
    }

    async function toggleFollowOtherUser() {
      if (!viewingOtherUid) return;
      const isFollowing = (me.following || []).includes(viewingOtherUid);
      const myRef = db.collection("users").doc(me.uid);
      const targetRef = db.collection("users").doc(viewingOtherUid);

      if (isFollowing) {
        await myRef.update({ following: FV.arrayRemove(viewingOtherUid) });
        await targetRef.update({ followers: FV.arrayRemove(me.uid) });
        me.following = (me.following || []).filter(id => id !== viewingOtherUid);
      } else {
        await myRef.update({ following: FV.arrayUnion(viewingOtherUid) });
        await targetRef.update({ followers: FV.arrayUnion(me.uid) });
        me.following = [...(me.following || []), viewingOtherUid];
      }
      openUserProfile(viewingOtherUid);
    }

    function messageViewedUser() {
      if (!viewingOtherUid) return;
      const uid = viewingOtherUid;
      const uname = document.getElementById("otherProfileHeaderTitle").innerText.replace(/^@/, "");
      const avatar = document.getElementById("otherProfileAvatar").src;
      closeOtherUserProfile();
      switchNav('messages');
      openDirectChat(uid, uname, avatar, false);
    }

    async function blockViewedUser() {
      if (!viewingOtherUid || !confirm("Block this user?")) return;
      await db.collection("users").doc(me.uid).update({ blockedUsers: FV.arrayUnion(viewingOtherUid) });
      me.blockedUsers = [...(me.blockedUsers || []), viewingOtherUid];
      closeOtherUserProfile();
      showToast("User blocked.");
    }

    function openAvatarZoom(imgUrl, usernameLabel) {
      document.getElementById("avatarZoomImg").src = imgUrl;
      document.getElementById("avatarZoomCaption").innerText = usernameLabel || "";
      document.getElementById("avatarZoomModal").classList.add("show");
    }

    function closeAvatarZoom() {
      document.getElementById("avatarZoomModal").classList.remove("show");
    }

    // --- 9. TAP-TO-REVEAL UNIVERSAL SEARCH (NAME, USERNAME, BIO) ---
    function activateSearchBar() {
      document.getElementById("searchRevealTrigger").classList.add("hidden");
      document.getElementById("searchActiveBox").classList.remove("hidden");
      const inp = document.getElementById("searchInput");
      inp.focus();
    }

    function deactivateSearchBar() {
      document.getElementById("searchInput").value = "";
      document.getElementById("searchResults").innerHTML = "";
      document.getElementById("searchActiveBox").classList.add("hidden");
      document.getElementById("searchRevealTrigger").classList.remove("hidden");
    }

    async function handleUniversalSearch(q) {
      const query = q.trim().toLowerCase().replace(/^@/, "");
      const box = document.getElementById("searchResults");
      box.innerHTML = "";
      if (!query) return;

      const [usersSnap, postsSnap] = await Promise.all([
        db.collection("users").limit(40).get(),
        db.collection("posts").limit(40).get()
      ]);

      usersSnap.forEach(d => {
        if (d.id === me.uid) return;
        const u = d.data();
        if ((u.username && u.username.toLowerCase().includes(query)) ||
            (u.fullName && u.fullName.toLowerCase().includes(query)) ||
            (u.bio && u.bio.toLowerCase().includes(query))) {
          const onlineNow = isUserActuallyOnline(u);
          const div = document.createElement("div");
          div.style.cssText = "display:flex; align-items:center; justify-content:space-between; padding:10px; background:var(--panel); border-radius:12px; cursor:pointer; border:1px solid #1e1e1e;";
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px;" onclick="openUserProfile('${d.id}')">
              <div style="position:relative;">
                <img src="${u.avatar}" style="width:42px; height:42px; border-radius:50%; object-fit:cover;">
                <span class="presence-dot ${onlineNow ? 'online' : 'offline'}" style="position:absolute; bottom:1px; right:1px; border:2px solid #000;"></span>
              </div>
              <div>
                <div style="font-weight:700;">@${u.username}</div>
                <div style="font-size:0.75rem; color:var(--muted);">${u.fullName}</div>
              </div>
            </div>
            <button class="btn-solid" style="width:auto; padding:6px 14px; font-size:0.8rem;" onclick="openUserProfile('${d.id}')">Profile</button>
          `;
          box.appendChild(div);
        }
      });

      postsSnap.forEach(d => {
        const p = d.data();
        if (p.caption && p.caption.toLowerCase().includes(query)) {
          const div = document.createElement("div");
          div.style.cssText = "padding:10px; background:var(--panel); border-radius:10px; cursor:pointer; font-size:0.85rem; border:1px solid #1e1e1e;";
          div.innerHTML = `<strong>@${p.authorUsername}</strong>: ${p.caption}`;
          div.onclick = () => openPostDetailScreen(d.id);
          box.appendChild(div);
        }
      });
    }

    // --- 10. ROUTING CONTROLLER ---
    function switchNav(tab) {
      pushNavState(tab);
      renderNavSection(tab);
    }

    function renderNavSection(tab) {
      document.getElementById("storiesTray").classList.toggle("hidden", tab !== 'feed');
      document.getElementById("feedSection").classList.toggle("hidden", tab !== 'feed');
      document.getElementById("searchSection").classList.toggle("hidden", tab !== 'search');
      document.getElementById("messagesSection").classList.toggle("hidden", tab !== 'messages');
      document.getElementById("activitySection").classList.toggle("hidden", tab !== 'activity');
      document.getElementById("profileSection").classList.toggle("hidden", tab !== 'profile');

      // Show top-right Settings gear icon ONLY on Profile section
      document.getElementById("headerProfileMenu").classList.toggle("hidden", tab !== 'profile');

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("navProfileThumb").classList.remove("active");

      if (tab === 'feed') document.getElementById("tabHome").classList.add("active");
      if (tab === 'search') document.getElementById("tabSearch").classList.add("active");
      if (tab === 'messages') document.getElementById("tabMessages").classList.add("active");
      if (tab === 'profile') {
        document.getElementById("navProfileThumb").classList.add("active");
        loadProfileData();
      }
    }

    function formatTimeAgo(date) {
      if (!date) return "Just now";
      const s = Math.floor((new Date() - date) / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h`;
      return `${Math.floor(h / 24)}d`;
    }

    function closeModal(id) { document.getElementById(id).classList.remove("show"); }
  </script>
</body>
</html>
