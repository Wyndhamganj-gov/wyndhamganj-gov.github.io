<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WDM Media</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Firebase Compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #000000;
  --panel: #121212;
  --line: #262626;
  --txt: #f5f5f5;
  --muted: #8e8e8e;
  --accent: #0095f6;
  --like: #ff3040;
  --story-grad: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg); color: var(--txt); min-height: 100vh; padding-bottom: 60px; overflow-x: hidden; }

/* Header */
header.app-header {
  position: sticky; top: 0; z-index: 50; background: rgba(0,0,0,0.95);
  border-bottom: 1px solid var(--line); height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
}
.brand { font-size: 22px; font-weight: 800; background: var(--story-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.head-actions { display: flex; gap: 16px; font-size: 1.2rem; cursor: pointer; }

.main-wrap { max-width: 600px; margin: 0 auto; }

/* Bottom Nav */
nav.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 52px; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-around; z-index: 50; font-size: 1.25rem;
}
.nav-btn { color: var(--muted); cursor: pointer; }
.nav-btn.active { color: var(--txt); }

/* Modals */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-mask.show { display: flex; }
.modal-sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 420px; padding: 20px; }
.field-group { margin-bottom: 12px; }
.field-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
.field-input { width: 100%; background: #1c1c1c; border: 1px solid var(--line); color: var(--txt); padding: 10px; border-radius: 8px; outline: none; }
.btn-solid { width: 100%; background: var(--accent); color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; }
#toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #222; border: 1px solid var(--line); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; z-index: 300; display: none; }
.hidden { display: none !important; }
</style>
</head>
<body>

  <header class="app-header">
    <span class="brand">WDM</span>
    <div class="head-actions">
      <i class="fa-solid fa-gear" onclick="openSettingsModal()"></i>
    </div>
  </header>

  <div class="main-wrap">
    <!-- Feed Section -->
    <section id="feedSection" style="padding:16px;">
      <div id="postsFeed"></div>
    </section>

    <!-- Search Section -->
    <section id="searchSection" class="hidden" style="padding:14px;">
      <input type="text" class="field-input" placeholder="Search users..." oninput="handleSearch(this.value)">
      <div id="searchResults" style="margin-top:12px;"></div>
    </section>

    <!-- Messages Section -->
    <section id="messagesSection" class="hidden" style="padding:14px;">
      <h3>Messages</h3>
      <div id="dmList"></div>
    </section>

    <!-- Profile Section -->
    <section id="profileSection" class="hidden" style="padding:14px;">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:14px;">
        <img id="profileAvatar" src="" style="width:70px; height:70px; border-radius:50%; object-fit:cover;">
        <div>
          <h3 id="profileName">User</h3>
          <p id="profileHandle" style="color:var(--muted);">@username</p>
        </div>
      </div>
      <button class="btn-solid" onclick="openSettingsModal()">Settings</button>
    </section>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <i class="fa-solid fa-house nav-btn active" onclick="switchTab('feed')"></i>
    <i class="fa-solid fa-magnifying-glass nav-btn" onclick="switchTab('search')"></i>
    <i class="fa-solid fa-square-plus nav-btn" onclick="triggerPostUpload()"></i>
    <i class="fa-solid fa-message nav-btn" onclick="switchTab('messages')"></i>
    <i class="fa-solid fa-user nav-btn" onclick="switchTab('profile')"></i>
  </nav>

  <!-- Auth Modal -->
  <div class="modal-mask show" id="authModal">
    <div class="modal-sheet">
      <h3>Sign In / Register</h3>
      <div class="field-group" style="margin-top:12px;">
        <label>Email</label>
        <input type="email" id="authEmail" class="field-input" placeholder="Enter email">
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="authPass" class="field-input" placeholder="Enter password">
      </div>
      <button class="btn-solid" onclick="handleEmailAuth()">Sign In</button>
      <button class="btn-solid" style="background:#fff; color:#000; margin-top:8px;" onclick="handleGoogleAuth()">Continue with Google</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-mask" id="settingsModal">
    <div class="modal-sheet">
      <h3>Settings</h3>
      <div class="field-group" style="margin-top:14px;">
        <label>Change Password (Current / New)</label>
        <input type="password" id="oldPass" class="field-input" placeholder="Old Password" style="margin-bottom:6px;">
        <input type="password" id="newPass" class="field-input" placeholder="New Password">
        <button class="btn-solid" style="margin-top:8px;" onclick="updatePassword()">Update Password</button>
      </div>
      <button class="btn-solid" style="background:var(--like); margin-top:16px;" onclick="logout()">Log Out</button>
      <button class="btn-solid" style="background:#262626; margin-top:8px;" onclick="closeModal('settingsModal')">Close</button>
    </div>
  </div>

  <div id="toast"></div>

  <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="uploadPost(this)">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD8ojVhoikbnCRAQ4WrDEkJfdMONeXcuFc",
      authDomain: "wdm-update.firebaseapp.com",
      projectId: "wdm-update",
      storageBucket: "wdm-update.firebasestorage.app",
      messagingSenderId: "677435578526",
      appId: "1:677435578526:web:74119dc8309c4ba744838f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg; t.style.display = "block";
      setTimeout(() => t.style.display = "none", 2500);
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        document.getElementById("authModal").classList.remove("show");
        const docRef = db.collection("users").doc(user.uid);
        const doc = await docRef.get();
        if (!doc.exists) {
          await docRef.set({ uid: user.uid, username: user.email.split('@')[0], email: user.email, avatar: user.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120" }, { merge: true });
        }
        loadUserData();
        loadFeed();
      } else {
        document.getElementById("authModal").classList.add("show");
      }
    });

    async function handleEmailAuth() {
      const email = document.getElementById("authEmail").value.trim();
      const pass = document.getElementById("authPass").value.trim();
      if (!email || !pass) return showToast("Enter email and password");
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch(e) {
        try {
          await auth.createUserWithEmailAndPassword(email, pass);
        } catch(err) { showToast(err.message); }
      }
    }

    async function handleGoogleAuth() {
      try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      } catch(e) { showToast(e.message); }
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    async function loadUserData() {
      if (!currentUser) return;
      const u = (await db.collection("users").doc(currentUser.uid).get()).data();
      if (u) {
        document.getElementById("profileName").innerText = u.username || "User";
        document.getElementById("profileHandle").innerText = "@" + (u.username || "user");
        document.getElementById("profileAvatar").src = u.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120";
      }
    }

    function switchTab(tab) {
      document.getElementById("feedSection").classList.toggle("hidden", tab !== 'feed');
      document.getElementById("searchSection").classList.toggle("hidden", tab !== 'search');
      document.getElementById("messagesSection").classList.toggle("hidden", tab !== 'messages');
      document.getElementById("profileSection").classList.toggle("hidden", tab !== 'profile');
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
    }

    function triggerPostUpload() { document.getElementById("fileInput").click(); }
    async function uploadPost(input) {
      if (input.files && input.files[0]) {
        showToast("Uploading post...");
        const file = input.files[0];
        const fd = new FormData();
        fd.append("file", file);
        fd.append("upload_preset", "wdm_media");
        const res = await fetch("https://api.cloudinary.com/v1_1/afcw94ij/image/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (data.secure_url) {
          await db.collection("posts").add({
            authorId: currentUser.uid,
            authorUsername: currentUser.email.split('@')[0],
            mediaUrl: data.secure_url,
            caption: "New post",
            likes: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          showToast("Posted successfully!");
        }
      }
    }

    function loadFeed() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snap => {
        const feed = document.getElementById("postsFeed");
        feed.innerHTML = "";
        snap.forEach(doc => {
          const p = doc.data();
          const card = document.createElement("div");
          card.style.cssText = "margin-bottom:16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden;";
          card.innerHTML = `
            <div style="padding:10px; font-weight:700;">@${p.authorUsername}</div>
            <img src="${p.mediaUrl}" style="width:100%; max-height:450px; object-fit:cover;">
            <div style="padding:10px; font-weight:600;">${(p.likes || []).length} likes</div>
          `;
          feed.appendChild(card);
        });
      });
    }

    function openSettingsModal() { document.getElementById("settingsModal").classList.add("show"); }
    function closeModal(id) { document.getElementById(id).classList.remove("show"); }

    async function updatePassword() {
      const oldP = document.getElementById("oldPass").value;
      const newP = document.getElementById("newPass").value;
      if (!newP || newP.length < 6) return showToast("New password must be at least 6 chars");
      try {
        if (oldP) {
          const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldP);
          await currentUser.reauthenticateWithCredential(cred);
        }
        await currentUser.updatePassword(newP);
        showToast("Password updated!");
        closeModal("settingsModal");
      } catch(e) { showToast(e.message); }
    }

    async function handleSearch(q) {
      const box = document.getElementById("searchResults");
      box.innerHTML = "";
      if (!q.trim()) return;
      const snap = await db.collection("users").get();
      snap.forEach(d => {
        const u = d.data();
        if (u.username.toLowerCase().includes(q.toLowerCase())) {
          const div = document.createElement("div");
          div.style.cssText = "padding:8px; background:var(--panel); margin-bottom:6px; border-radius:6px;";
          div.innerText = "@" + u.username;
          box.appendChild(div);
        }
      });
    }
  </script>
</body>
</html>
